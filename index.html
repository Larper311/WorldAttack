<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World at War 3 — Fully Enhanced</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#030a14;color:#e6f0fa;font:13px/1.45 "Segoe UI",system-ui,sans-serif;display:flex;height:100vh;overflow:hidden}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#hud{display:flex;gap:8px;align-items:center;padding:8px 14px;background:linear-gradient(180deg,#0b1c30,#081525);border-bottom:1px solid #1a3555;flex-wrap:wrap;box-shadow:0 3px 12px #0008}
#hud b{color:#ffd54a}
#hud .tag{background:#122a44;padding:3px 8px;border-radius:5px;font-size:12px;border:1px solid #1e3a5a}
#wrap{flex:1;position:relative;min-height:0;background:#04101c}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
#cv:active{cursor:grabbing}
#tip{position:absolute;pointer-events:none;background:#000d;backdrop-filter:blur(8px);padding:8px 12px;border-radius:8px;display:none;font-size:12px;line-height:1.5;border:1px solid #2a4a6a;max-width:280px;z-index:5;box-shadow:0 6px 20px #000a}
#zb{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:4px}
button{background:linear-gradient(180deg,#1c4e82,#163d68);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;transition:all .15s;box-shadow:0 2px 6px #0005}
button:hover{background:linear-gradient(180deg,#2a6aa8,#1e5088);transform:translateY(-1px)}
button:active{transform:scale(.97)}
button:disabled{opacity:.35;cursor:default;transform:none}
button.on{background:linear-gradient(180deg,#d49a00,#b87a00);box-shadow:0 0 0 1px #ffc040,0 2px 8px #0006}
#log{height:82px;overflow:auto;background:#04101c;padding:5px 12px;font-size:11.5px;border-top:1px solid #1a3555;scrollbar-width:thin}
#log .w{color:#ff8a80}#log .g{color:#8fe9b0}#log .n{color:#ffcc66}#log .x{color:#9ab}
#side{width:340px;background:linear-gradient(180deg,#0b1c30,#081420);border-left:1px solid #1a3555;padding:12px;overflow:auto;line-height:1.5;scrollbar-width:thin}
#side h3{margin:0 0 8px;font-size:14px;color:#ffd54a}
#side hr{border:0;border-top:1px solid #1a3555;margin:10px 0}
.row{padding:7px 0;border-bottom:1px solid #142838}
.bar{height:6px;background:#1a3048;border-radius:3px;margin:4px 0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .3s}
#md{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(4px)}
#mc{background:linear-gradient(160deg,#0e2740,#0a1c30);border:1px solid #3a6a9a;border-radius:16px;padding:26px 30px;max-width:480px;text-align:center;line-height:1.55;box-shadow:0 16px 50px #000c}
#mc h2{margin:0 0 12px;font-size:21px}
#mc button{font-size:14px;padding:9px 18px;margin:8px 5px 0}
#toasts{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:15;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.ts{background:#0d2740ee;border:1px solid #3a6a9a;padding:8px 18px;border-radius:9px;font-size:13px;box-shadow:0 5px 18px #0007;animation:toastIn .3s ease}
.ts.w{border-color:#e55}.ts.g{border-color:#5c8}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.lb-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #142838;font-size:12px}
.lb-rank{width:24px;color:#8ab;font-weight:600}
.lb-name{flex:1;font-weight:500}
.lb-val{color:#ffd54a;font-variant-numeric:tabular-nums}
#settings{position:absolute;right:14px;bottom:14px;z-index:6}
#settingsBtn{background:linear-gradient(180deg,#2a3a55,#1e2c42);font-size:16px;padding:8px 12px}
#setPanel{display:none;position:absolute;right:0;bottom:46px;background:#0c1e32ee;border:1px solid #2a4a6a;border-radius:10px;padding:12px 16px;min-width:220px;box-shadow:0 8px 24px #000a}
#setPanel label{display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer;font-size:13px}
#setPanel input[type=checkbox]{width:16px;height:16px;accent-color:#3a8}
@media(max-width:900px){body{flex-direction:column}#side{width:100%;height:36%;border-left:0;border-top:1px solid #1a3555}}
</style>
</head>

// ========== DIPLOMACY ==========
const ally = (a,b) => { C[a].al.add(b); C[b].al.add(a); };
const unally = (a,b) => { C[a].al.delete(b); C[b].al.delete(a); };

function allyCheck(f,t){
  const F=C[f], T=C[t];
  if(T.war.has(f)) return [0,'is at war with you'];
  if(F.al.size >= 3) return [0,'You already have 3 alliances'];
  if(T.al.size >= 3) return [0,'already has enough alliances'];
  const r = T.rel[f];
  if(r < 38) return [0, `does not trust you enough yet (trust ${r|0}/38)`];
  let p = 0.11 + (r-38)/115;
  for(const w of T.war) if(F.war.has(w)) p += 0.2;
  p -= F.inf * 0.13;
  return [Math.max(0.03, Math.min(0.7, p)), ''];
}

function peace(a,b){
  C[a].war.delete(b); C[b].war.delete(a);
  log(`🕊 Ceasefire: ${C[a].name} & ${C[b].name}`, 'g', a===P||b===P);
}

function warOn(a,b){
  const A=C[a], B=C[b];
  if(A.war.has(b)) return;
  if(A.al.has(b)){
    unally(a,b); A.inf++;
    C.forEach(c => c.rel[a] -= 20);
    log(`💔 ${A.name} betrayed ${B.name}!`, 'w', 1);
  }
  A.war.add(b); B.war.add(a);
  B.rel[a] = Math.min(B.rel[a], -70);
  log(`⚔ ${A.name} declared war on ${B.name}`, 'w', a===P||b===P);
  for(const x of [...B.al]){
    if(x!==a && C[x].alive && Math.random() < 0.82){
      C[x].rel[a] -= 30;
      log(`🛡 ${C[x].name} defends ${B.name}`, 'n', x===P);
      warOn(x,a);
    }
  }
  for(const x of [...A.al]){
    if(x!==b && C[x].alive && !B.al.has(x) && Math.random() < 0.5){
      log(`🤝 ${C[x].name} joins ${A.name}`, 'n', x===P);
      warOn(x,b);
    }
  }
}

// ========== MILITARY ==========
function send(fi,ti,fr, isNaval=false, isAir=false){
  const f=Rg[fi], t=Rg[ti], o=f.o;
  if(f.troops < 2) return 'Not enough troops there';
  const l = f.nb.find(z => z[0]===ti);
  if(!l && !isAir) return 'Not adjacent (or use airlift)';
  const n = Math.floor(f.troops * fr);
  if(n < 1) return '';
  const to = t.o;
  if(to !== o){
    if(C[o].al.has(to)) return 'Cannot attack an ally';
    if(!C[o].war.has(to)) warOn(o,to);
  }
  f.troops -= n;
  const dist = Math.hypot(f.cx-t.cx, f.cy-t.cy);
  let mult = 1;
  if(isAir) mult = 0.55;          // planes are faster
  else if(l && l[1]) mult = 1.55; // naval slower
  else if(isNaval) mult = 1.4;

  M.push({
    f:fi, t:ti, o, n: (l && l[1]) || isNaval ? n*0.85 : n,
    st:gt, arr: gt + Math.max(0.7, dist/90) * mult,
    type: isAir ? 'plane' : ((l && l[1]) || isNaval ? 'ship' : 'land')
  });
  return '';
}

function arrive(m){
  const t=Rg[m.t], o=m.o;
  if(t.o===o || C[o].al.has(t.o)){ t.troops += m.n; return; }
  if(!C[o].war.has(t.o)){
    const f=Rg[m.f];
    (f.o===o ? f : t).troops += m.n;
    return;
  }
  const v = t.inv.find(z => z.o===o);
  v ? v.n += m.n : t.inv.push({o, n:m.n});
  // spawn battle particles
  if(settings.particles){
    for(let i=0;i<8;i++) particles.push({
      x:t.cx+(Math.random()-0.5)*20, y:t.cy+(Math.random()-0.5)*20,
      vx:(Math.random()-0.5)*30, vy:(Math.random()-0.5)*30,
      life:0.5+Math.random()*0.6, col:'#ff6644', size:2+Math.random()*3
    });
  }
}

function battle(r){
  let A = r.inv.reduce((s,v) => s+v.n, 0);
  if(A < 0.5){ r.inv=[]; return; }
  const x = () => 0.86 + Math.random()*0.28;
  const D = r.troops;
  const dm = defm(r);
  const dD = Math.min(D, A * 0.14 * x());
  const dA = D * dm * 0.12 * x();
  r.troops = D - dD;
  const k = Math.max(0, 1 - dA/A);
  r.inv.forEach(v => v.n *= k);
  r.inv = r.inv.filter(v => v.n >= 0.35);
  A = r.inv.reduce((s,v) => s+v.n, 0);
  if(r.troops < 0.6 && A > 0.5){
    const winner = r.inv.reduce((a,b) => b.n > a.n ? b : a).o;
    capture(r, winner, A);
  } else if(A < 0.4){
    r.inv = [];
    log(`🛡 ${C[r.o].name} repelled the attack on ${r.nm}`, 'n', r.o===P);
  }
}

function capture(r, o, n){
  const old = r.o, O=C[old], Nw=C[o];
  r.o = o; r.troops = Math.max(1.8, n); r.inv=[]; r.b.fort=0; r.un=5;
  dirty=1;
  const loot = Math.floor(O.money * 0.045);
  O.money -= loot; Nw.money += loot;
  log(`🚩 ${Nw.name} captured ${r.nm} from ${O.name}`, 'w', old===P||o===P);
  if(settings.particles){
    for(let i=0;i<16;i++) particles.push({
      x:r.cx, y:r.cy, vx:(Math.random()-0.5)*50, vy:(Math.random()-0.5)*50,
      life:0.9+Math.random()*0.7, col:Nw.col, size:3+Math.random()*5
    });
  }
  if(r.i === O.cap){
    log(`💥 ${O.name}'s capital has fallen!`, 'w', 1);
    own(old).forEach(z => z.troops *= 0.76);
    O.money *= 0.42; O.nuk = 0; O.mis >>= 1;
    Nw.money += O.money * 0.28;
  }
  if(!own(old).length){
    O.alive=0;
    O.al.forEach(x => C[x].al.delete(old));
    C.forEach(c => c.war.delete(old));
    O.al.clear(); O.war.clear();
    log(`🏴 ${O.name} has been ELIMINATED`, 'w', 1);
  }
}

function launch(a, ti, nuke){
  const A=C[a], t=Rg[ti], e=t.o;
  const sil = own(a).filter(r => r.b.silo > 0);
  if(!sil.length) return 'Need a Missile Silo';
  if(nuke ? A.nuk < 1 : A.mis < 1) return 'None in stock';
  if(e === a) return '';
  if(!A.war.has(e)){
    if(A.al.has(e)) return 'Cannot hit an ally';
    warOn(a,e);
  }
  const s = sil.sort((x,y) => Math.hypot(x.cx-t.cx,x.cy-t.cy) - Math.hypot(y.cx-t.cx,y.cy-t.cy))[0];
  nuke ? A.nuk-- : A.mis--;
  fx.push({
    k: nuke?'n':'m', x1:s.cx, y1:s.cy, x2:t.cx, y2:t.cy,
    t:0, d: nuke?2.9:1.8,
    cb: () => impact(a,ti,nuke)
  });
  return '';
}

function impact(a, ti, nuke){
  const t=Rg[ti], A=C[a];
  fx.push({k:'b', x1:t.cx, y1:t.cy, t:0, d:nuke?2.5:1.15, R:nuke?85:28});
  if(settings.particles){
    for(let i=0;i<(nuke?36:16);i++){
      particles.push({
        x:t.cx, y:t.cy,
        vx:(Math.random()-0.5)*(nuke?110:50),
        vy:(Math.random()-0.5)*(nuke?110:50),
        life:0.7+Math.random()*1.3,
        col: nuke ? `hsl(${15+Math.random()*40},95%,55%)` : '#ffaa30',
        size: 2+Math.random()*(nuke?9:5)
      });
    }
  }
  if(nuke){
    t.troops *= 0.18;
    for(const k in t.b) t.b[k] >>= 1;
    t.rad = 40;
    t.nb.forEach(([j]) => { if(Rg[j].o === t.o) Rg[j].troops *= 0.68; });
    A.inf += 2.8;
    flash = 1.25;
    C.forEach(c => c.rel[a] -= c.al.has(a) ? 14 : 45);
    log(`☢ ${A.name} NUKED ${t.nm}! The world is horrified.`, 'w', 1);
  } else {
    t.troops *= 0.74;
    const ks = Object.keys(t.b).filter(k => t.b[k]>0);
    if(ks.length && Math.random() < 0.6) t.b[ks[rnd(ks.length)]]--;
    log(`🚀 ${A.name}'s missile hit ${t.nm}`, 'n', t.o===P);
  }
  dirty=1;
}

function airlift(fi, ti, fr){
  const f = Rg[fi], A = C[f.o];
  if(A.planes < 1 && !own(f.o).some(r => r.b.air > 0)) return 'Need airbase or planes';
  if(f.troops < 3) return 'Not enough troops';

  if(n < 1) return '';
  f.troops -= n;
  if(A.planes > 0) A.planes--;

    f:fi, t:ti, o:f.o, n: n*0.9,
    st:gt, arr: gt + Math.max(0.6, Math.hypot(f.cx-Rg[ti].cx, f.cy-Rg[ti].cy)/140),
    type: 'plane'
  });
  return '';
}

// ========== AI (smarter) ==========
function ai(o){
  const A = C[o], rs = own(o);
  if(!rs.length) return;

  // Build / recruit smarter
  if(A.money > 200){
    // prioritize front-line forts and income
    const fronts = rs.filter(r => r.nb.some(z => A.war.has(Rg[z[0]].o)));
    const targets = fronts.length ? fronts : rs;
    for(let i=0; i<2; i++){
      const r = targets[rnd(targets.length)];
      const w = Math.random();
      let k;
      if(fronts.includes(r) && r.b.fort < 2 && w < 0.45) k = 'fort';
      else if(w < 0.35) k = 'mine';
      else if(w < 0.55) k = 'fact';
      else if(w < 0.72 && A.pw >= 2) k = 'port';
      else if(w < 0.85 && A.pw >= 3) k = 'air';
      else k = A.pw >= 3 ? 'silo' : 'mine';
      if(r.b[k] < 3 && A.money > cost(k,r)){
        A.money -= cost(k,r); r.b[k]++;
      } else if(A.money > 300 && Math.random() < 0.4){
        A.money -= 52; r.troops += 13;
      }
    }
  }
  if(NK.has(A.name) && A.money > 2000 && Math.random() < 0.035){
    A.money -= 1750; A.nuk++;
  }
  if(A.pw >= 2 && A.money > 900 && Math.random() < 0.06){
    A.money -= 250; A.mis++;
  }
  if(A.pw >= 3 && A.money > 600 && Math.random() < 0.05){
    A.money -= 180; A.planes = (A.planes||0) + 1;
  }

  // Relations drift
  const nb = [...new Set(rs.flatMap(r => r.nb.map(z => Rg[z[0]].o)))].filter(x => x!==o && C[x].alive);
  if(nb.length && day % 8 === o % 8){
    const x = nb[rnd(nb.length)];
    A.rel[x] += Math.random()*5 - 3;
  }

  // Independent wars — more thoughtful
  if(A.war.size < 2 && day > 20 && Math.random() < 0.005 + 0.012*A.ag){
    const rivals = (RIVALS[A.name] || []).map(n => C.find(c => c.name===n)).filter(c => c && c.alive && !A.al.has(c.id) && !A.war.has(c.id));
    let targets = nb.filter(x => !A.al.has(x) && A.rel[x] < 18 &&
      str(o) + [...A.al].reduce((s,z)=>s+str(z),0) > 1.3 * (str(x) + [...C[x].al].reduce((s,z)=>s+str(z),0)));
    if(rivals.length && Math.random() < 0.5) targets = rivals.map(c => c.id).filter(id => targets.includes(id) || Math.random()<0.35);
    if(targets.length) warOn(o, targets[rnd(targets.length)]);
  }

  // War management
  if(A.war.size){
    const dist = new Map(), q = [];
    rs.forEach(r => {
      if(r.nb.some(z => A.war.has(Rg[z[0]].o))){ dist.set(r.i,0); q.push(r); }
    });
    for(let h=0; h<q.length; h++){
      const r = q[h];
      r.nb.forEach(([j]) => {
        const n = Rg[j];
        if(n.o===o && !dist.has(j)){ dist.set(j, dist.get(r.i)+1); q.push(n); }
      });
    }
    let n=0;
    for(const r of rs){
      const d = dist.get(r.i);
      if(d>0 && r.troops>14 && n<8){
        const b = r.nb.map(z=>Rg[z[0]]).find(x => x.o===o && dist.get(x.i)<d);
        if(b){ send(r.i, b.i, 0.5); n++; }
      }
    }
    let at=0;
    for(const f of rs){
      if(f.troops < 16 || at >= 3) continue;
      let bt=null, br=1.3;
      for(const [j] of f.nb){
        const t = Rg[j];
        if(!A.war.has(t.o)) continue;
        const ra = (f.troops * 0.7) / (t.troops * defm(t) + 4);
        if(ra > br){ br=ra; bt=t; }
      }
      if(bt){ send(f.i, bt.i, 0.7); at++; }
    }
    // Use air if available
    if(A.planes > 0 && Math.random() < 0.12){
      const en = [...A.war].filter(x => C[x].alive);
      if(en.length){
        const er = own(en[rnd(en.length)]);
        if(er.length){
          const tgt = er.sort((x,y)=>y.troops-x.troops)[0];
          const src = rs.filter(r => r.troops > 20).sort((a,b)=>b.troops-a.troops)[0];
          if(src) airlift(src.i, tgt.i, 0.4);
        }
      }
    }
    // Missiles / nukes
    const en = [...A.war].filter(x => C[x].alive);
    if(en.length){
      const er = own(en[rnd(en.length)]);
      if(A.mis > 0 && Math.random() < 0.08 && er.length){
        launch(o, er.sort((x,y)=>y.troops-x.troops)[0].i, 0);
      }
      if(A.nuk > 0 && A.ag > 0.72 && Math.random() < 0.015 && er.length){
        launch(o, er[rnd(er.length)].i, 1);
      }
      // Peace — rarer
      for(const e of en){
        if(day - A.lastPeaceOffer < 28) continue;
        const myStr = str(o), theirStr = str(e);
        const wantPeace = (myStr < theirStr * 0.5 && Math.random() < 0.035) ||
                          (Math.random() < 0.004) ||
                          (A.war.size > 1 && Math.random() < 0.025);
        if(wantPeace){
          A.lastPeaceOffer = day;
          if(e === P && settings.dipRequests){
            ask('🕊 Ceasefire offer', `<b>${A.name}</b> asks for a ceasefire.`, [
              {l:'Accept', fn:()=>peace(o,P)}, {l:'Refuse'}
            ]);
          } else if(Math.random() < 0.4) peace(o,e);
        }
      }
    }
  }

  // Alliance offers — heavily gated by setting
  if(settings.dipRequests && Math.random() < 0.005 && day - A.lastAllyOffer > 28 && P!==null && C[P].alive &&
     !A.war.has(P) && !A.al.has(P) && A.rel[P] >= 50 && A.al.size < 3 && C[P].al.size < 3){
    A.lastAllyOffer = day;
    ask('🤝 Alliance offer', `<b>${A.name}</b> proposes a military alliance.`, [
      {l:'Accept', fn:()=>{ ally(o,P); log(`🤝 You allied with ${A.name}`,'g',1); }},
      {l:'Decline'}
    ]);
  } else if(Math.random() < 0.004 && A.al.size < 3){
    const t = C.find(c => c.alive && c.id!==o && c.id!==P && !A.al.has(c.id) && !A.war.has(c.id) &&
      c.al.size < 3 && A.rel[c.id] > 48 && c.rel[o] > 48);
    if(t){ ally(o,t.id); log(`🤝 ${A.name} & ${t.name} formed an alliance`,'g'); }
  }
}

function daily(){
  day++;
  Rg.forEach(r => {
    const A = C[r.o];
    if(r.rad > 0){ r.rad--; r.troops *= 0.982; return; }
    if(r.un > 0) r.un--;
    else {
      A.money += inc(r);
      if(r.troops < tcap(r)) r.troops += 0.13 + r.b.fact * 1.3 + (r.i===A.cap ? 0.6 : 0) + (r.b.air ? 0.2 : 0);
    }
    if(r.o !== r.c && C[r.c].alive && r.troops < 5 && !r.inv.length && Math.random() < 0.006){
      log(`✊ ${r.nm} rose up and returned to ${C[r.c].name}!`, 'n', 1);
      const old = C[r.o];
      r.o = r.c; r.troops = 9; dirty=1;
      if(!own(old.id).length) old.alive=0;
    }
  });
  Rg.forEach(r => { if(r.inv.length) battle(r); });
  C.forEach(c => {
    if(!c.alive) return;
    if(c.id !== P && day % G[diff] === c.id % G[diff]) ai(c.id);
    for(const w of c.war) c.rel[w] = Math.max(-100, c.rel[w]-0.95);
    for(const a of c.al) c.rel[a] = Math.min(100, c.rel[a]+0.13);
    for(const x of c.war) for(const w of C[x].war) if(w!==c.id && !c.war.has(w)) c.rel[w] = Math.min(100, c.rel[w]+0.28);
    if(c.id === P) C.forEach(x => {
      if(x.alive && x.id!==P && !c.war.has(x.id)) x.rel[P] = Math.min(100, x.rel[P]+0.045);
    });
  });
  check(); dirty=1; ui();
}

function end(w){
  over=1; speed=0;
  ask(w?'🏆 Victory!':'💀 Your nation has fallen',
    w ? 'You dominate the world.' : 'Your last region was captured.',
    [{l:'Play again', fn:()=>location.reload()}]);
}
function check(){
  if(over || P===null) return;
  if(!C[P].alive) return end(0);
  if(own(P).length >= WIN || C.every(c => c.id===P || !c.alive)) end(1);
}

// ========== PLAYER ACTIONS ==========
function build(k){
  const r=Rg[sel]; if(r.o!==P) return;
  const c=cost(k,r);
  if(r.b[k]>=3 || C[P].money < c) return log('Cannot build that','x');
  C[P].money -= c; r.b[k]++; ui();
}
function recruit(n,c){
  const r=Rg[sel]; if(r.o!==P || C[P].money < c) return log('Not enough money','x');
  C[P].money -= c; r.troops += n; ui();
}
function go(f,t,fr){
  const e=send(f,t,fr); if(e) log(e,'x',1); ui();
}
function act(f,t){
  const to=Rg[t].o, p=C[P];
  if(to===P || p.war.has(to)) return go(f,t,frac);
  if(p.al.has(to)) return ask('Betray ally?', `Attack your ally <b>${C[to].name}</b>? Everyone will trust you less.`,
    [{l:'Betray',fn:()=>go(f,t,frac)},{l:'Cancel'}]);
  ask('Declare war?', `Attack <b>${C[to].name}</b>? This declares war (their allies may join).`,
    [{l:'Declare war',fn:()=>go(f,t,frac)},{l:'Cancel'}]);
}
function missile(nk){
  const e=launch(P,sel,nk); if(e) log(e,'x',1); ui();
}
function buy(k){
  const costs = {nuk:1750, mis:250, plane:180};
  const c = costs[k] || 250, A=C[P];
  if(k==='nuk' && !NK.has(A.name)) return log('Only nuclear powers can build nukes','x',1);
  if(A.money < c) return log('Not enough money','x');
  A.money -= c;
  if(k==='nuk') A.nuk++;
  else if(k==='mis') A.mis++;
  else if(k==='plane') A.planes = (A.planes||0)+1;
  ui();
}
function dip(k,id){
  const p=C[P], t=C[id];
  if(k==='gift'){
    if(p.money < 150) return log('Not enough money','x');
    p.money -= 150; t.rel[P] = Math.min(100, t.rel[P]+10);
    log(`🎁 ${t.name} appreciates your gift (trust ${t.rel[P]|0})`,'g');
  } else if(k==='ally'){
    if(t.dn[P] > day) log(`${t.name} won't talk until day ${t.dn[P]}`,'x',1);
    else {
      const [pr,why] = allyCheck(P,id);
      if(!pr) log(`❌ ${t.name} ${why}`,'w',1);
      else if(Math.random() < pr){ ally(P,id); log(`🤝 ${t.name} ACCEPTED your alliance!`,'g',1); }
      else { t.dn[P]=day+12; log(`❌ ${t.name} DENIED your alliance.`,'w',1); }
    }
  } else if(k==='peace'){
    const chance = (str(id) < str(P)*1.2 ? 0.58 : 0.16) + (t.war.size>1 ? 0.2 : 0);
    if(Math.random() < chance) peace(P,id);
    else log(`❌ ${t.name} rejects a ceasefire.`,'w',1);
  } else if(k==='war'){
    const g = () => { warOn(P,id); ui(); };
    p.al.has(id) ? ask('Betray ally?', `Attack your ally <b>${t.name}</b>?`, [{l:'Betray',fn:g},{l:'Cancel'}]) : g();
  }
  ui();
}

    const alive = C.filter(c => c.alive);

    const byCash = [...alive].sort((a,b) => b.money - a.money);

      ${byReg.slice(0,8).map((c,i)=>`<div class="lb-row"><span class="lb-rank">${i+1}</span><span class="lb-name" style="color:${c.col}">${c.name}${c.id===P?' ★':''}</span><span class="lb-val">${own(c.id).length} reg</span></div>`).join('')}
      <hr><b>Richest</b>
      ${byCash.slice(0,6).map((c,i)=>`<div class="lb-row"><span class="lb-rank">${i+1}</span><span class="lb-name" style="color:${c.col}">${c.name}${c.id===P?' ★':''}</span><span class="lb-val">$${c.money|0}</span></div>`).join('')}
      <hr><b>Strongest Army</b>

      ${byNuk.length?`<hr><b>Nuclear Stockpile</b>
      ${byNuk.slice(0,5).map((c,i)=>`<div class="lb-row"><span class="lb-rank">${i+1}</span><span class="lb-name" style="color:${c.col}">${c.name}${c.id===P?' ★':''}</span><span class="lb-val">☢ ${c.nuk}</span></div>`).join('')}`:''}`;
  }
  Sd.innerHTML = h;
}

// ========== RENDER ==========
const cv = $('#cv'), ctx = cv.getContext('2d');
const off = document.createElement('canvas');
off.width = W; off.height = H;
const ox = off.getContext('2d');
const im = ox.createImageData(W,H);
const p32 = new Uint32Array(im.data.buffer);
const O = new Uint8Array(512);

let z=1, vx=0, vy=0, minZ=0.3, cw=0, ch=0, dpr=1, mxp=0, myp=0, drag=null;

function fit(){
  z = minZ = Math.min(cw/W, ch/H) * 0.97;
  vx = (cw - W*z)/2; vy = (ch - H*z)/2;
}
function resize(){
  dpr = devicePixelRatio || 1;
  const w = $('#wrap');
  cw = w.clientWidth; ch = w.clientHeight;
  cv.width = cw * dpr; cv.height = ch * dpr;
  const f = z === minZ;
  minZ = Math.min(cw/W, ch/H) * 0.97;
  if(f || z < minZ) fit();
}
addEventListener('resize', resize);

function zoomAt(sx,sy,f){
  const nz = Math.max(minZ, Math.min(16, z*f));
  vx = sx - (sx-vx)*nz/z;
  vy = sy - (sy-vy)*nz/z;
  z = nz;
}

const hit = (sx,sy) => {
  const x = Math.floor((sx-vx)/z), y = Math.floor((sy-vy)/z);
  if(x<0||y<0||x>=W||y>=H) return -1;
  const v = RID[y*W+x];
  return v===N ? -1 : v;
};

function paint(){
  const base=[], e1=[], e2=[], e3=[], tg = sel>=0 && Rg[sel].o===P ? new Set(Rg[sel].nb.map(z=>z[0])) : new Set;
  Rg.forEach(r => {
    const c = C[r.o];
    O[r.i] = r.o;
    let [R_,G,B_] = hsl(c.h, c.s, c.l + ((r.i*7)%5 - 2)*1.3);
    if(r.rad > 0){ G = Math.min(255, G+90); R_ *= 0.7; B_ *= 0.75; }
    let m=0, rd=0;
    if(r.i===sel) m=0.45;
    else if(r.i===hov) m=0.2;
    else if(tg.has(r.i)){ if(r.o!==P) rd=0.3; else m=0.12; }
    if(m){ R_+=(255-R_)*m; G+=(255-G)*m; B_+=(255-B_)*m; }
    if(rd){ R_+=(255-R_)*rd; G*=1-rd; B_*=1-rd; }
    base[r.i] = pk(R_,G,B_);
    e1[r.i] = pk(R_,G,B_,0.65);
    e2[r.i] = pk(R_,G,B_,0.78);
    e3[r.i] = pk(R_,G,B_,0.35);
  });
  for(let y=0,i=0; y<H; y++){
    for(let x=0; x<W; x++,i++){
      const a = RID[i];
      if(a===N){ p32[i]=0; continue; }
      let e=0;
      const b = x<W-1 ? RID[i+1] : N;
      const d = y<H-1 ? RID[i+W] : N;
      if(b!==a) e = b===N ? 1 : (O[a]!==O[b] ? 3 : 2);
      if(d!==a){ const f = d===N ? 1 : (O[a]!==O[d] ? 3 : 2); if(f>e) e=f; }
      p32[i] = e===0 ? base[a] : e===1 ? e1[a] : e===2 ? e2[a] : e3[a];
    }
  }
  ox.putImageData(im,0,0);
  dirty=0;
}

cv.addEventListener('pointerdown', e => {
  drag = {x:e.clientX, y:e.clientY, vx, vy, m:0, b:e.button};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  const rc = cv.getBoundingClientRect();
  mxp = e.clientX - rc.left; myp = e.clientY - rc.top;
  if(drag && drag.b===0){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>5) drag.m=1;
    if(drag.m){ vx=drag.vx+dx; vy=drag.vy+dy; }
  } else {
    const h = hit(mxp,myp);
    if(h !== hov){ hov=h; dirty=1; }
    const t = $('#tip');
    if(h>=0){
      const r=Rg[h];
      let s = `<b>${r.nm}</b><br>${C[r.o].name} · 🪖${r.troops|0}`;
      if(P!==null && sel>=0 && Rg[sel].o===P && r.o!==P && Rg[sel].nb.some(z=>z[0]===h)){
        const n = Rg[sel].troops * frac, e2 = r.troops * defm(r), q = n/e2;
        s += `<br>Your ${n|0} vs ${e2|0} def<br>Odds <b>${q.toFixed(2)}</b> — ${
          q>1.6?'<span style="color:#8fe9b0">strong</span>':
          q>1.15?'<span style="color:#ffcc66">risky</span>':
          '<span style="color:#ff8a80">likely fail</span>'}`;
      }
      t.style.display='block'; t.style.left=(mxp+14)+'px'; t.style.top=(myp+14)+'px'; t.innerHTML=s;
    } else t.style.display='none';
  }
});
cv.addEventListener('pointerup', () => {
  if(drag && !drag.m && drag.b===0) click(mxp,myp);
  drag=null;
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(mxp, myp, Math.exp(-e.deltaY * 0.0014));
}, {passive:false});
cv.addEventListener('contextmenu', e => {
  e.preventDefault();
  const h=hit(mxp,myp);
  if(h>=0 && P!==null){ sel=h; dirty=1; ui(); }
});

function click(sx,sy){
  const h=hit(sx,sy);
  if(h<0){ sel=-1; dirty=1; ui(); return; }
  if(P===null){
    P=Rg[h].o; speed=1; tab=0; sel=h;
    log(`You now command ${C[P].name}. Good luck!`,'g',1);
  } else if(!insp && sel>=0 && Rg[sel].o===P && h!==sel && Rg[sel].nb.some(z=>z[0]===h)){
    act(sel,h);
  } else sel=h;
  dirty=1; ui();
}

function draw(dt, t){
  // deeper ocean gradient
  const g = ctx.createLinearGradient(0,0,0,ch);
  g.addColorStop(0,'#0a3d6a'); g.addColorStop(0.6,'#062a4a'); g.addColorStop(1,'#031820');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=g; ctx.fillRect(0,0,cw,ch);

  // Animated sea overlay
  if(settings.animatedSea){
    seaOffset += dt * 18;
    ctx.save();
    ctx.setTransform(dpr*z, 0, 0, dpr*z, dpr*vx, dpr*vy);
    ctx.globalAlpha = 0.12;
    ctx.strokeStyle = '#4af';
    ctx.lineWidth = 1.5 / z;
    for(let y=0; y<H; y+=28){
      ctx.beginPath();
      for(let x=0; x<W; x+=12){
        const wave = Math.sin((x + seaOffset)*0.018 + y*0.01) * 4 + Math.sin((x - seaOffset*0.7)*0.012)*3;
        const yy = y + wave;
        x===0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  C.forEach(c => { c.tt=0; c.lab=null; });
  Rg.forEach(r => {
    const c=C[r.o]; c.tt += r.troops;
    if(!c.lab || r.n > c.lab.n) c.lab = r;
  });
  C.forEach(c => { if(c.alive && Rg[c.cap].o===c.id) c.lab=Rg[c.cap]; });

  if(dirty) paint();

  ctx.imageSmoothingEnabled = z < 2.4;
  ctx.setTransform(dpr*z, 0, 0, dpr*z, dpr*vx, dpr*vy);
  const lw = 1/z;

  // subtle grid
  ctx.strokeStyle = 'rgba(255,255,255,0.035)';
  ctx.lineWidth = lw;
  ctx.beginPath();
  for(let lo=-150; lo<=180; lo+=30){ const x=(lo+170)*S; ctx.moveTo(x,0); ctx.lineTo(x,H); }
  for(let la=-30; la<=70; la+=30){ const y=(84-la)*S; ctx.moveTo(0,y); ctx.lineTo(W,y); }
  ctx.stroke();

  // map
  ctx.shadowColor = 'rgba(0,0,0,0.45)';
  ctx.shadowBlur = 10;
  ctx.drawImage(off, 0, 0);
  ctx.shadowBlur = 0;

  // region details (trees, houses, buildings) when zoomed
  if(z > 2.8 && settings.animations){
    for(const r of Rg){
      if(Math.hypot(r.cx*z+vx - cw/2, r.cy*z+vy - ch/2) > Math.max(cw,ch)*0.9) continue;
      // buildings
      const b = r.b;
      let bx = r.cx - 8, by = r.cy + 6;
      if(b.mine){ ctx.font = `${11*lw*1.4}px serif`; ctx.fillText('⛏', bx, by); bx+=10; }
      if(b.fact){ ctx.font = `${11*lw*1.4}px serif`; ctx.fillText('🏭', bx, by); bx+=11; }
      if(b.fort){ ctx.font = `${11*lw*1.4}px serif`; ctx.fillText('🧱', bx, by); bx+=10; }
      if(b.silo){ ctx.font = `${11*lw*1.4}px serif`; ctx.fillText('🚀', bx, by); bx+=11; }
      if(b.port){ ctx.font = `${11*lw*1.4}px serif`; ctx.fillText('⚓', bx, by); bx+=10; }
      if(b.air){ ctx.font = `${11*lw*1.4}px serif`; ctx.fillText('✈️', bx, by); }
      // small details
      for(const d of r.details){
        ctx.globalAlpha = 0.55;
        if(d.t==='tree'){ ctx.fillStyle='#2a5'; ctx.beginPath(); ctx.arc(d.x,d.y,2.2*lw,0,7); ctx.fill(); }
        else if(d.t==='house'){ ctx.fillStyle='#c96'; ctx.fillRect(d.x-1.5*lw,d.y-1.5*lw,3*lw,3*lw); }
        else { ctx.fillStyle='#789'; ctx.beginPath(); ctx.arc(d.x,d.y,1.4*lw,0,7); ctx.fill(); }
      }
      ctx.globalAlpha = 1;
    }
  }

  // troop movements — improved animated trails + icons
  for(const m of M){
    const f=Rg[m.f], e=Rg[m.t];
    const p = Math.min(1, (gt-m.st)/(m.arr-m.st));
    const x = f.cx + (e.cx-f.cx)*p, y = f.cy + (e.cy-f.cy)*p;
    ctx.strokeStyle = C[m.o].col;
    ctx.lineWidth = 2.4 * lw;
    ctx.setLineDash([8*lw, 5*lw]);
    ctx.beginPath(); ctx.moveTo(f.cx,f.cy); ctx.lineTo(e.cx,e.cy); ctx.stroke();
    ctx.setLineDash([]);

    // glow
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.arc(x,y,7*lw,0,7); ctx.fill();
    ctx.fillStyle = C[m.o].col;
    ctx.beginPath(); ctx.arc(x,y,4*lw,0,7); ctx.fill();

    // type icon
    ctx.font = `${12*lw}px serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    const icon = m.type==='plane' ? '✈️' : m.type==='ship' ? '🚢' : '🪖';
    ctx.fillText(icon, x, y - 9*lw);
  }

  // missiles / nukes / explosions — much nicer
  fx = fx.filter(f => {
    f.t += dt;
    const p = Math.min(1, f.t/f.d);
    if(f.k==='m' || f.k==='n'){
      const hh = f.k==='n' ? 70 : 38;
      const x = f.x1+(f.x2-f.x1)*p;
      const y = f.y1+(f.y2-f.y1)*p - Math.sin(Math.PI*p)*hh;
      // long trail
      for(let i=1;i<14;i++){
        const u = Math.max(0, p - i*0.022);
        const tx = f.x1+(f.x2-f.x1)*u;
        const ty = f.y1+(f.y2-f.y1)*u - Math.sin(Math.PI*u)*hh;
        ctx.fillStyle = `rgba(255,${f.k==='n'?90:180},40,${0.6-i*0.04})`;
        ctx.beginPath();
        ctx.arc(tx, ty, (5.5-i*0.3)*lw*1.8, 0,7);
        ctx.fill();
      }
      // head
      ctx.fillStyle = f.k==='n' ? '#ff3' : '#fff';
      ctx.beginPath(); ctx.arc(x,y,(f.k==='n'?9:5)*lw*1.6,0,7); ctx.fill();
      if(f.k==='n'){
        ctx.fillStyle = '#f80';
        ctx.beginPath(); ctx.arc(x,y,5*lw,0,7); ctx.fill();
      }
    } else {
      // bigger explosion
      const alpha = 1-p;
      ctx.fillStyle = `rgba(255,${140-90*p},20,${alpha})`;
      ctx.beginPath(); ctx.arc(f.x1,f.y1, f.R*p, 0,7); ctx.fill();
      ctx.strokeStyle = `rgba(255,210,80,${0.7-p*0.7})`;
      ctx.lineWidth = 4*lw;
      ctx.beginPath(); ctx.arc(f.x1,f.y1, f.R*p*1.2, 0,7); ctx.stroke();
      if(f.k==='b' && p > 0.3){
        ctx.fillStyle = `rgba(255,255,200,${(1-p)*0.5})`;
        ctx.beginPath(); ctx.arc(f.x1,f.y1, f.R*p*0.4, 0,7); ctx.fill();
      }
    }
    if(f.t >= f.d){ f.cb && f.cb(); return false; }
    return true;
  });

  // particles
  if(settings.particles){
    particles = particles.filter(p => {
      p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 28*dt;
      if(p.life <= 0) return false;
      ctx.globalAlpha = Math.min(1, p.life*1.5);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size*lw, 0,7); ctx.fill();
      ctx.globalAlpha = 1;
      return true;
    });
  }

  // labels
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 3.5;

  if(z < 2.6){
    C.forEach(c => {
      if(!c.alive || !c.lab) return;
      const x = c.lab.cx*z + vx, y = c.lab.cy*z + vy;
      if(x<-80||x>cw+80||y<-30||y>ch+30) return;
      if(z < 1.2 && c.pw < 2 && c.id !== P) return;
      ctx.font = `bold ${Math.min(16, 8.5+z*3.4)|0}px system-ui`;
      ctx.fillStyle = '#fff';
      ctx.fillText(c.name, x, y);
      ctx.font = `${Math.min(13, 7.5+z*2.8)|0}px system-ui`;
      ctx.fillStyle = '#ffe9a0';
      ctx.fillText('🪖'+(c.tt|0), x, y+13);
    });
  } else {
    for(const r of Rg){
      const x = r.cx*z + vx, y = r.cy*z + vy;
      if(x<-60||x>cw+60||y<-25||y>ch+25) continue;
      ctx.font = 'bold 13px system-ui';
      ctx.fillStyle = '#fff';
      ctx.fillText('🪖'+(r.troops|0), x, y);
      const s = Object.keys(r.b).map(k => r.b[k]?ICON[k]+r.b[k]:'').join('');
      ctx.font = '11px system-ui';
      if(s) ctx.fillText(s, x, y+14);
      if(z > 4.8){ ctx.fillStyle='#cfe'; ctx.fillText(r.nm, x, y-14); }
    }
  }

  // battle markers — pulsing
  for(const r of Rg) if(r.inv.length){
    const x = r.cx*z+vx, y = r.cy*z+vy;
    const p = 0.5 + 0.5*Math.sin(t*8);
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(255,40,40,${0.3+0.35*p})`;
    ctx.beginPath(); ctx.arc(x, y-20, 13+6*p, 0,7); ctx.fill();
    ctx.font = '18px system-ui';
    ctx.fillStyle = '#fff';
    ctx.fillText('⚔', x, y-20);
  }

  ctx.shadowBlur = 0;
  if(flash > 0){
    ctx.fillStyle = `rgba(255,255,255,${flash*0.8})`;
    ctx.fillRect(0,0,cw,ch);
    flash -= dt * 1.1;
  }
}

let last = performance.now(), T0 = 0;
function loop(n){
  const dt = Math.min(0.1, (n-last)/1000);
  last = n; T0 += dt;
  if(speed && !over && !modal && P!==null){
    gt += dt * speed / 1.05;
    for(let i=M.length-1; i>=0; i--){
      if(M[i].arr <= gt){ arrive(M[i]); M.splice(i,1); }
    }
    while(day < Math.floor(gt)) daily();
  }
  draw(dt, T0);
  requestAnimationFrame(loop);
}

// ========== START ==========
resize(); fit(); ui();
log('Pick your nation by clicking it.','n');
requestAnimationFrame(loop);

ask('🌍 World at War 3 — Fully Enhanced',
  `Nicer colors · animated oceans · detailed regions (buildings, trees) · better rockets & nukes · improved combat animations · denser sea travel · planes & airlifts · smarter AI · <b>settings to turn off diplomacy spam</b>.<br>
  Difficulty only changes how often AIs act. Click a country after choosing difficulty.<br>
  <small>Scroll = zoom · drag = pan · right-click = inspect · ⚙️ = settings</small>`,
  [
    {l:'Easy', fn:()=>diff=0},
    {l:'Normal', fn:()=>diff=1},
    {l:'Hard', fn:()=>diff=2}
  ]);
</script>
</body>
