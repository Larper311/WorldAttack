<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Country Simulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f1a;
    color: #e0e0e0;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  #game-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  canvas {
    background: #1a1a2e;
    border: 2px solid #333;
    cursor: crosshair;
    max-width: 100%;
    max-height: 90vh;
  }
  #sidebar {
    width: 280px;
    background: #16162a;
    border-left: 2px solid #333;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  h2 { font-size: 1.1rem; color: #7eb8ff; margin-bottom: 4px; }
  .stat { font-size: 0.95rem; }
  .stat span { color: #fff; font-weight: 600; }
  button {
    background: #2a4a7a;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background 0.15s;
  }
  button:hover { background: #3a5a9a; }
  button:disabled { background: #444; cursor: not-allowed; opacity: 0.6; }
  .btn-danger { background: #8a2a2a; }
  .btn-danger:hover { background: #aa3a3a; }
  .btn-success { background: #2a7a4a; }
  .btn-success:hover { background: #3a9a5a; }
  .panel {
    background: #1e1e35;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #333;
  }
  .nation-list { display: flex; flex-direction: column; gap: 6px; }
  .nation-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
  }
  .color-box {
    width: 14px; height: 14px;
    border-radius: 3px;
    border: 1px solid #555;
  }
  #log {
    flex: 1;
    min-height: 120px;
    max-height: 200px;
    overflow-y: auto;
    font-size: 0.8rem;
    background: #111;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #333;
  }
  .log-entry { margin-bottom: 4px; opacity: 0.9; }
  .log-war { color: #ff6b6b; }
  .log-ally { color: #6bffb8; }
  .log-build { color: #ffd56b; }
  #selected-info { min-height: 60px; }
  .hint { font-size: 0.75rem; color: #888; margin-top: 4px; }
</style>
</head>
<body>

<div id="game-area">
  <canvas id="c" width="800" height="600"></canvas>
</div>

<div id="sidebar">
  <div class="panel">
    <h2>Your Nation</h2>
    <div class="stat">Money: <span id="money">0</span></div>
    <div class="stat">Troops: <span id="troops">0</span></div>
    <div class="stat">Land: <span id="land">0</span></div>
  </div>

  <div class="panel">
    <h2>Actions</h2>
    <button id="btn-recruit" onclick="recruit()">Recruit Troops (100¢)</button>
    <button id="btn-farm" onclick="build('farm')" style="margin-top:6px">Build Farm (150¢)</button>
    <button id="btn-barracks" onclick="build('barracks')" style="margin-top:6px">Build Barracks (250¢)</button>
    <div class="hint">Select one of your tiles first</div>
  </div>

  <div class="panel" id="selected-info">
    <h2>Selected Tile</h2>
    <div id="tile-details">Click a tile</div>
  </div>

  <div class="panel">
    <h2>Diplomacy</h2>
    <div id="diplomacy" class="nation-list"></div>
  </div>

  <div class="panel">
    <h2>Nations</h2>
    <div id="nations-list" class="nation-list"></div>
  </div>

  <div class="panel" style="flex:1; display:flex; flex-direction:column;">
    <h2>Event Log</h2>
    <div id="log"></div>
  </div>
</div>

<script>
// ===================== CONFIG =====================
const TILE = 20;
const COLS = 40;
const ROWS = 30;
const PLAYER_ID = 1;

const COLORS = {
  0: '#1a2a3a',      // water / empty
  1: '#4a90e2',      // player
  2: '#e24a4a',      // red AI
  3: '#4ae24a',      // green AI
  4: '#e2a04a'       // orange AI
};

const NAMES = {
  1: "Blue Republic",
  2: "Crimson Empire",
  3: "Emerald League",
  4: "Sunset Kingdom"
};

// ===================== STATE =====================
let map = [];          // map[y][x] = { owner, building, troops }
let nations = {};
let selected = null;   // {x, y}
let attackFrom = null; // for two-click attack
let tick = 0;

// ===================== INIT =====================
function init() {
  // create empty map
  map = Array.from({length: ROWS}, () =>
    Array.from({length: COLS}, () => ({ owner: 0, building: null, troops: 0 }))
  );

  // place water borders
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (x === 0 || y === 0 || x === COLS-1 || y === ROWS-1) {
        map[y][x].owner = -1; // water
      }
    }
  }

  // nations
  nations = {
    1: { id:1, name:NAMES[1], money:800, troops:40, allies:[], atWar:[], color:COLORS[1] },
    2: { id:2, name:NAMES[2], money:600, troops:30, allies:[], atWar:[], color:COLORS[2] },
    3: { id:3, name:NAMES[3], money:600, troops:30, allies:[], atWar:[], color:COLORS[3] },
    4: { id:4, name:NAMES[4], money:600, troops:30, allies:[], atWar:[], color:COLORS[4] }
  };

  // starting territories
  seedNation(1, 8, 12, 4);
  seedNation(2, 28, 8, 3);
  seedNation(3, 10, 22, 3);
  seedNation(4, 30, 22, 3);

  log("Game started. Expand, build, and form alliances!", "normal");
  updateUI();
  draw();
  setInterval(gameTick, 1000); // economy + AI every second
}

function seedNation(id, cx, cy, size) {
  for (let dy = -size; dy <= size; dy++) {
    for (let dx = -size; dx <= size; dx++) {
      const x = cx + dx, y = cy + dy;
      if (x > 0 && y > 0 && x < COLS-1 && y < ROWS-1) {
        if (Math.abs(dx) + Math.abs(dy) <= size) {
          map[y][x].owner = id;
          if (dx === 0 && dy === 0) map[y][x].building = 'capital';
        }
      }
    }
  }
}

// ===================== DRAW =====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const cell = map[y][x];
      let color = COLORS[0];
      if (cell.owner === -1) color = '#0a1520';
      else if (cell.owner > 0) color = COLORS[cell.owner];

      ctx.fillStyle = color;
      ctx.fillRect(x * TILE, y * TILE, TILE - 1, TILE - 1);

      // building indicator
      if (cell.building) {
        ctx.fillStyle = cell.building === 'farm' ? '#8f8' :
                        cell.building === 'barracks' ? '#f88' : '#ff0';
        ctx.fillRect(x * TILE + 5, y * TILE + 5, 9, 9);
      }

      // troop count (small)
      if (cell.troops > 0) {
        ctx.fillStyle = '#fff';
        ctx.font = '10px sans-serif';
        ctx.fillText(cell.troops, x * TILE + 2, y * TILE + 12);
      }
    }
  }

  // selection highlight
  if (selected) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(selected.x * TILE, selected.y * TILE, TILE - 1, TILE - 1);
  }
  if (attackFrom) {
    ctx.strokeStyle = '#ff0';
    ctx.lineWidth = 2;
    ctx.strokeRect(attackFrom.x * TILE, attackFrom.y * TILE, TILE - 1, TILE - 1);
  }

  requestAnimationFrame(draw);
}

// ===================== INPUT =====================
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = Math.floor((e.clientX - rect.left) * scaleX / TILE);
  const y = Math.floor((e.clientY - rect.top) * scaleY / TILE);

  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return;
  const cell = map[y][x];

  // first click: select own tile or start attack
  if (!attackFrom) {
    if (cell.owner === PLAYER_ID) {
      selected = {x, y};
      attackFrom = {x, y};
      updateSelectedInfo();
    } else {
      selected = {x, y};
      attackFrom = null;
      updateSelectedInfo();
    }
  } else {
    // second click: try to attack / move
    if (x === attackFrom.x && y === attackFrom.y) {
      // cancel
      attackFrom = null;
      selected = {x, y};
    } else if (isAdjacent(attackFrom.x, attackFrom.y, x, y)) {
      attemptAttack(attackFrom.x, attackFrom.y, x, y);
      attackFrom = null;
    } else {
      // reselect
      if (cell.owner === PLAYER_ID) {
        attackFrom = {x, y};
        selected = {x, y};
      } else {
        attackFrom = null;
        selected = {x, y};
      }
    }
    updateSelectedInfo();
  }
  updateUI();
});

function isAdjacent(x1, y1, x2, y2) {
  return Math.abs(x1 - x2) + Math.abs(y1 - y2) === 1;
}

// ===================== COMBAT =====================
function attemptAttack(fx, fy, tx, ty) {
  const from = map[fy][fx];
  const to = map[ty][tx];

  if (from.owner !== PLAYER_ID || from.troops < 1) {
    log("Not enough troops on that tile.", "normal");
    return;
  }

  // can't attack allies
  if (to.owner > 0 && nations[PLAYER_ID].allies.includes(to.owner)) {
    log("You are allied with them!", "ally");
    return;
  }

  // declare war if needed
  if (to.owner > 0 && !nations[PLAYER_ID].atWar.includes(to.owner)) {
    declareWar(PLAYER_ID, to.owner);
  }

  const attackers = from.troops;
  let defenders = to.troops;

  // fort bonus
  if (to.building === 'barracks' || to.building === 'capital') defenders += 8;
  if (to.building === 'farm') defenders += 3;

  // simple combat
  const attackPower = attackers * (0.8 + Math.random() * 0.4);
  const defensePower = defenders * (0.9 + Math.random() * 0.3);

  if (attackPower > defensePower) {
    // victory
    const losses = Math.floor(defenders * 0.6 + Math.random() * 5);
    from.troops = Math.max(0, attackers - losses);
    to.owner = PLAYER_ID;
    to.troops = Math.max(1, Math.floor(from.troops * 0.4));
    from.troops = Math.max(0, from.troops - to.troops);
    to.building = to.building === 'capital' ? null : to.building; // capital falls
    log(`You captured a tile! (${tx},${ty})`, "war");
  } else {
    // defeat
    const losses = Math.floor(attackers * 0.7);
    from.troops = Math.max(0, attackers - losses);
    to.troops = Math.max(0, defenders - Math.floor(losses * 0.4));
    log(`Attack failed. Lost ${losses} troops.`, "war");
  }

  // allies may join
  checkDefensivePacts(to.owner, PLAYER_ID);
}

function declareWar(a, b) {
  if (!nations[a].atWar.includes(b)) nations[a].atWar.push(b);
  if (!nations[b].atWar.includes(a)) nations[b].atWar.push(a);
  // break alliance if any
  nations[a].allies = nations[a].allies.filter(id => id !== b);
  nations[b].allies = nations[b].allies.filter(id => id !== a);
  log(`${nations[a].name} declared war on ${nations[b].name}!`, "war");
}

function checkDefensivePacts(attacked, attacker) {
  if (attacked <= 0) return;
  nations[attacked].allies.forEach(allyId => {
    if (!nations[allyId].atWar.includes(attacker)) {
      declareWar(allyId, attacker);
      log(`${nations[allyId].name} joins the war to defend their ally!`, "war");
    }
  });
}

// ===================== BUILDING & RECRUIT =====================
function recruit() {
  if (!selected) return log("Select one of your tiles first.", "normal");
  const cell = map[selected.y][selected.x];
  if (cell.owner !== PLAYER_ID) return log("You don't own that tile.", "normal");
  if (nations[PLAYER_ID].money < 100) return log("Not enough money.", "normal");

  nations[PLAYER_ID].money -= 100;
  cell.troops += 5;
  nations[PLAYER_ID].troops += 5;
  log("Recruited 5 troops.", "build");
  updateUI();
}

function build(type) {
  if (!selected) return log("Select one of your tiles first.", "normal");
  const cell = map[selected.y][selected.x];
  if (cell.owner !== PLAYER_ID) return log("You don't own that tile.", "normal");
  if (cell.building) return log("Tile already has a building.", "normal");

  const cost = type === 'farm' ? 150 : 250;
  if (nations[PLAYER_ID].money < cost) return log("Not enough money.", "normal");

  nations[PLAYER_ID].money -= cost;
  cell.building = type;
  log(`Built ${type} at (${selected.x},${selected.y})`, "build");
  updateUI();
}

// ===================== ECONOMY & AI TICK =====================
function gameTick() {
  tick++;

  // income for every nation
  for (let id in nations) {
    let income = 0;
    let troopGen = 0;
    let land = 0;

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const c = map[y][x];
        if (c.owner == id) {
          land++;
          income += 2;
          if (c.building === 'farm') income += 6;
          if (c.building === 'barracks') troopGen += 1;
          if (c.building === 'capital') income += 4;
        }
      }
    }
    nations[id].money += income;
    // distribute new troops to capital or random owned tile
    if (troopGen > 0) {
      addTroopsToNation(+id, troopGen);
    }
  }

  // AI actions every 2 seconds
  if (tick % 2 === 0) {
    for (let id of [2,3,4]) {
      aiAct(id);
    }
  }

  updateUI();
}

function addTroopsToNation(id, amount) {
  // find a tile belonging to them
  const tiles = [];
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (map[y][x].owner === id) tiles.push({x,y});

  if (tiles.length === 0) return;
  const t = tiles[Math.floor(Math.random() * tiles.length)];
  map[t.y][t.x].troops += amount;
  nations[id].troops += amount;
}

// ===================== SIMPLE AI =====================
function aiAct(id) {
  const n = nations[id];
  if (n.money < 50) return;

  // find owned tiles
  const owned = [];
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (map[y][x].owner === id) owned.push({x,y});

  if (owned.length === 0) return;

  // 40% chance build
  if (Math.random() < 0.4 && n.money >= 150) {
    const t = owned[Math.floor(Math.random() * owned.length)];
    const cell = map[t.y][t.x];
    if (!cell.building) {
      if (n.money >= 250 && Math.random() < 0.4) {
        cell.building = 'barracks';
        n.money -= 250;
      } else {
        cell.building = 'farm';
        n.money -= 150;
      }
    }
  }

  // 50% chance expand / attack
  if (Math.random() < 0.55) {
    // pick a border tile
    const borders = [];
    owned.forEach(t => {
      [[0,1],[1,0],[0,-1],[-1,0]].forEach(([dx,dy]) => {
        const nx = t.x + dx, ny = t.y + dy;
        if (nx > 0 && ny > 0 && nx < COLS-1 && ny < ROWS-1) {
          const target = map[ny][nx];
          if (target.owner !== id && target.owner !== -1) {
            // don't attack allies
            if (target.owner === 0 || !n.allies.includes(target.owner)) {
              borders.push({from: t, to: {x:nx, y:ny}});
            }
          }
        }
      });
    });

    if (borders.length > 0) {
      const move = borders[Math.floor(Math.random() * borders.length)];
      const fromCell = map[move.from.y][move.from.x];
      if (fromCell.troops >= 3) {
        // move some troops and attack
        const send = Math.min(fromCell.troops, 4 + Math.floor(Math.random() * 6));
        fromCell.troops -= send;

        const toCell = map[move.to.y][move.to.x];
        if (toCell.owner === 0) {
          // claim neutral
          toCell.owner = id;
          toCell.troops = send;
        } else {
          // combat
          if (!n.atWar.includes(toCell.owner)) declareWar(id, toCell.owner);
          const def = toCell.troops + (toCell.building ? 5 : 0);
          if (send * (0.8 + Math.random()*0.5) > def) {
            toCell.owner = id;
            toCell.troops = Math.max(1, Math.floor(send * 0.5));
            toCell.building = toCell.building === 'capital' ? null : toCell.building;
          } else {
            // fail – troops lost
          }
        }
      }
    }
  }

  // occasional alliance offer to player or other AI
  if (Math.random() < 0.08) {
    const candidates = [1,2,3,4].filter(oid => oid !== id && !n.allies.includes(oid) && !n.atWar.includes(oid));
    if (candidates.length) {
      const target = candidates[Math.floor(Math.random() * candidates.length)];
      // auto-accept between AIs sometimes, player has to click
      if (target !== PLAYER_ID && Math.random() < 0.5) {
        formAlliance(id, target);
      }
    }
  }
}

// ===================== DIPLOMACY =====================
function formAlliance(a, b) {
  if (nations[a].allies.includes(b)) return;
  nations[a].allies.push(b);
  nations[b].allies.push(a);
  // remove war if any
  nations[a].atWar = nations[a].atWar.filter(id => id !== b);
  nations[b].atWar = nations[b].atWar.filter(id => id !== a);
  log(`${nations[a].name} and ${nations[b].name} formed an alliance!`, "ally");
  updateUI();
}

function breakAlliance(a, b) {
  nations[a].allies = nations[a].allies.filter(id => id !== b);
  nations[b].allies = nations[b].allies.filter(id => id !== a);
  log(`${nations[a].name} broke alliance with ${nations[b].name}.`, "war");
  updateUI();
}

function proposeAlliance(targetId) {
  // for simplicity player proposal is instantly accepted by AI (you can make it random)
  if (nations[PLAYER_ID].atWar.includes(targetId)) {
    log("Cannot ally while at war.", "normal");
    return;
  }
  formAlliance(PLAYER_ID, targetId);
}

// ===================== UI =====================
function updateUI() {
  const p = nations[PLAYER_ID];
  document.getElementById('money').textContent = Math.floor(p.money);
  document.getElementById('troops').textContent = countTroops(PLAYER_ID);
  document.getElementById('land').textContent = countLand(PLAYER_ID);

  // nations list
  let html = '';
  for (let id of [1,2,3,4]) {
    const n = nations[id];
    const land = countLand(id);
    html += `<div class="nation-row">
      <div class="color-box" style="background:${n.color}"></div>
      <span>${n.name} (${land} tiles)</span>
    </div>`;
  }
  document.getElementById('nations-list').innerHTML = html;

  // diplomacy
  let dip = '';
  for (let id of [2,3,4]) {
    const n = nations[id];
    const isAlly = p.allies.includes(id);
    const isWar = p.atWar.includes(id);
    dip += `<div class="nation-row">
      <div class="color-box" style="background:${n.color}"></div>
      <span style="flex:1">${n.name}</span>`;
    if (isAlly) {
      dip += `<button class="btn-danger" style="padding:4px 8px;font-size:0.75rem" onclick="breakAlliance(1,${id})">Break</button>`;
    } else if (isWar) {
      dip += `<span style="color:#f66;font-size:0.75rem">At War</span>`;
    } else {
      dip += `<button class="btn-success" style="padding:4px 8px;font-size:0.75rem" onclick="proposeAlliance(${id})">Ally</button>`;
    }
    dip += `</div>`;
  }
  document.getElementById('diplomacy').innerHTML = dip;
}

function updateSelectedInfo() {
  const el = document.getElementById('tile-details');
  if (!selected) {
    el.innerHTML = 'Click a tile';
    return;
  }
  const c = map[selected.y][selected.x];
  let ownerName = c.owner === -1 ? 'Water' :
                  c.owner === 0 ? 'Neutral' :
                  nations[c.owner]?.name || 'Unknown';
  el.innerHTML = `
    (${selected.x}, ${selected.y})<br>
    Owner: <b>${ownerName}</b><br>
    Troops: ${c.troops}<br>
    Building: ${c.building || 'none'}
  `;
}

function countLand(id) {
  let n = 0;
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (map[y][x].owner === id) n++;
  return n;
}

function countTroops(id) {
  let n = 0;
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (map[y][x].owner === id) n += map[y][x].troops;
  return n;
}

function log(msg, type = "normal") {
  const div = document.getElementById('log');
  const entry = document.createElement('div');
  entry.className = 'log-entry' + (type === 'war' ? ' log-war' : type === 'ally' ? ' log-ally' : type === 'build' ? ' log-build' : '');
  entry.textContent = `• ${msg}`;
  div.prepend(entry);
  if (div.children.length > 40) div.removeChild(div.lastChild);
}

// start
init();
</script>
</body>
</html>
