  else if(!mine)h+=`<hr><small>No adjacent region of yours with troops.</small>`;
  if(!mine)h+=`<hr>${B(`🚀 Missile (${p.missiles})`,'missile(0)',!p.missiles)}${B(`☢ Nuke (${p.nukes})`,'missile(1)',!p.nukes)}<br><small>Needs a 🚀 silo. SAMs in the target region can intercept.</small>`}}
 else if(tab==1){const nbr=new Set();own(P).forEach(r=>r.nb.forEach(z=>{if(R[z[0]].owner!==P)nbr.add(R[z[0]].owner)}));
  h+=`Alliances: ${p.allies.size}/3<br><small>Allies auto-join wars. Trust (≥30) is needed to ally.</small>`+C.filter(c=>c.alive&&c.id!==P).sort((a,b)=>nbr.has(b.id)-nbr.has(a.id)||str(b.id)-str(a.id)).map(c=>{const rl=c.rel[P],al=p.allies.has(c.id),w=p.war.has(c.id);

 else h+=`<h3>Research</h3>${[['atk','⚔ Weapons +10% attack'],['def','🛡 Armor +10% defense'],['eco','📈 Economy +12% income']].map(([k,n])=>B(`${n} (Lv ${p.tech[k]}) $${400*(p.tech[k]+1)}`,`tech('${k}')`,p.tech[k]>=5||p.money<400*(p.tech[k]+1))).join('<br>')}<hr><h3>Arsenal</h3>${B('🚀 Missile $250','buy(\'missile\')',p.money<250)}${B('☢ Nuke $2000','buy(\'nuke\')',p.money<2000)}<br><small>Missiles: ${p.missiles} · Nukes: ${p.nukes} · Silos: ${own(P).reduce((s,r)=>s+r.b.silo,0)}</small><hr>At war with: ${[...p.war].map(i=>C[i].name).join(', ')||'nobody'}<br>Allies: ${[...p.allies].map(i=>C[i].name).join(', ')||'none'}`;

// ---------- view & input
const cv=$('#cv'),ctx=cv.getContext('2d'),W=D.W,H=D.H;let z=1,vx=0,vy=0,minZ=.3,cw=0,ch=0,dpr=1,mx=0,my=0,drag=null;
function fit(){z=minZ=Math.min(cw/W,ch/H)*.98;vx=(cw-W*z)/2;vy=(ch-H*z)/2}
function resize(){dpr=devicePixelRatio||1;const w=$('#wrap');cw=w.clientWidth;ch=w.clientHeight;cv.width=cw*dpr;cv.height=ch*dpr;const f=z===minZ;minZ=Math.min(cw/W,ch/H)*.98;if(f||z<minZ)fit()}
addEventListener('resize',resize);
function zoomAt(sx,sy,f){const nz=Math.max(minZ,Math.min(14,z*f));vx=sx-(sx-vx)*nz/z;vy=sy-(sy-vy)*nz/z;z=nz}
const pip=(r,x,y)=>{let c=0;for(const l of r.loops)for(let i=0,j=l.length-2;i<l.length;j=i,i+=2){const xi=l[i],yi=l[i+1],xj=l[j],yj=l[j+1];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c^=1}return c};
function hit(sx,sy){const x=(sx-vx)/z,y=(sy-vy)/z;for(let i=R.length-1;i>=0;i--){const b=R[i].bb;if(x>=b[0]&&x<=b[2]&&y>=b[1]&&y<=b[3]&&pip(R[i],x,y))return i}return-1}
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx,vy,m:0,b:e.button};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{const rc=cv.getBoundingClientRect();mx=e.clientX-rc.left;my=e.clientY-rc.top;
 if(drag&&drag.b===0){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.m=1;if(drag.m){vx=drag.vx+dx;vy=drag.vy+dy}}
 else{hov=hit(mx,my);const t=$('#tip');if(hov>=0){const r=R[hov];t.style.display='block';t.style.left=mx+14+'px';t.style.top=my+14+'px';t.textContent=`${r.name} · ${C[r.owner].name} · 🪖${Math.floor(r.troops)}`}else t.style.display='none'}});
cv.addEventListener('pointerup',()=>{if(drag&&!drag.m&&drag.b===0)click(mx,my);drag=null});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(mx,my,Math.exp(-e.deltaY*.0015))},{passive:false});
cv.addEventListener('contextmenu',e=>{e.preventDefault();const t=hit(mx,my);if(t<0||P===null)return;const s=R[t].nb.map(z=>R[z[0]]).filter(x=>x.owner===P&&x.troops>=3).sort((a,b)=>b.troops-a.troops)[0];if(!s||R[t].owner===P&&0)return log('No adjacent region of yours with troops','x',1);go(s.i,t,.7)});
function click(sx,sy){const h=hit(sx,sy);if(h<0){sel=-1;ui();return}sel=h;
 if(P===null){P=R[h].owner;speed=1;tab=0;log(`You now command ${C[P].name}. Good luck!`,'g',1)}ui()}
// ---------- render
function draw(dt,t){const g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,'#0c3b60');g.addColorStop(1,'#082a47');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);
 C.forEach(c=>{c.tt=0;c.lr=null});R.forEach(r=>{const c=C[r.owner];c.tt+=r.troops;if(!c.lr||r.a>c.lr.a)c.lr=r});C.forEach(c=>{if(R[D.cap[c.id]].owner===c.id)c.lr=R[D.cap[c.id]]});
 ctx.setTransform(dpr*z,0,0,dpr*z,dpr*vx,dpr*vy);const lw=1/z;ctx.lineJoin='round';
 for(const r of R){ctx.fillStyle=r.fill;ctx.fill(r.path,'evenodd')}
 ctx.strokeStyle='rgba(0,0,0,.38)';ctx.lineWidth=.8*lw;for(const r of R)ctx.stroke(r.path);
 ctx.lineWidth=2.4*lw;ctx.globalAlpha=.85;for(const r of R)if(r.owner!==r.c){ctx.strokeStyle=C[r.c].col;ctx.stroke(r.path)}ctx.globalAlpha=1;
 C.forEach(c=>{let col='rgba(8,16,28,.9)',wd=1.5;if(P!==null){if(c.id===P){col='#ffd54a';wd=2.6}else if(C[P].allies.has(c.id)){col='#5f9';wd=2.4}else if(C[P].war.has(c.id)){col='#f55';wd=2.4}}ctx.strokeStyle=col;ctx.lineWidth=wd*lw;ctx.stroke(c.co)});
 for(const r of R)if(r.rad>0){ctx.fillStyle=`rgba(170,255,0,${.28+.12*Math.sin(t*4)})`;ctx.fill(r.path,'evenodd')}
 if(hov>=0&&hov!==sel){ctx.fillStyle='rgba(255,255,255,.16)';ctx.fill(R[hov].path,'evenodd')}
 if(sel>=0){ctx.strokeStyle='#fff';ctx.lineWidth=3*lw;ctx.stroke(R[sel].path)}
 for(const m of M){const f=R[m.f],e=R[m.t],p=Math.min(1,(gt-m.st)/(m.arr-m.st));ctx.strokeStyle=C[m.o].col;ctx.lineWidth=2*lw;ctx.setLineDash([6*lw,5*lw]);ctx.beginPath();ctx.moveTo(f.lx,f.ly);ctx.lineTo(e.lx,e.ly);ctx.stroke();ctx.setLineDash([]);
  const x=f.lx+(e.lx-f.lx)*p,y=f.ly+(e.ly-f.ly)*p;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,5*lw,0,7);ctx.fill();ctx.fillStyle=C[m.o].col;ctx.beginPath();ctx.arc(x,y,3.4*lw,0,7);ctx.fill()}
 fx=fx.concat(q);q=[];
 fx=fx.filter(f=>{f.t+=dt;const p=Math.min(1,f.t/f.d);
  if(f.k=='m'||f.k=='n'){const hh=f.k=='n'?110:70,x=f.x1+(f.x2-f.x1)*p,y=f.y1+(f.y2-f.y1)*p-Math.sin(Math.PI*p)*hh;
   for(let i=1;i<9;i++){const u=Math.max(0,p-i*.02);ctx.fillStyle=`rgba(255,${f.k=='n'?120:200},60,${.5-i*.05})`;ctx.beginPath();ctx.arc(f.x1+(f.x2-f.x1)*u,f.y1+(f.y2-f.y1)*u-Math.sin(Math.PI*u)*hh,(4-i*.3)*lw*2,0,7);ctx.fill()}
   ctx.fillStyle=f.k=='n'?'#ff4':'#fff';ctx.beginPath();ctx.arc(x,y,(f.k=='n'?7:4)*lw*1.6,0,7);ctx.fill()}
  else{ctx.fillStyle=`rgba(255,${180-120*p},40,${1-p})`;ctx.beginPath();ctx.arc(f.x1,f.y1,f.R*p,0,7);ctx.fill();ctx.strokeStyle=`rgba(255,255,255,${1-p})`;ctx.lineWidth=2*lw;ctx.beginPath();ctx.arc(f.x1,f.y1,f.R*p*1.3,0,7);ctx.stroke()}
  if(f.t>=f.d){f.cb&&f.cb();return false}return true});
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#000';ctx.shadowBlur=3;
 if(z<2.3)C.forEach(c=>{if(!c.alive||!c.lr)return;const x=c.lr.lx*z+vx,y=c.lr.ly*z+vy;if(x<-60||x>cw+60||y<-20||y>ch+20)return;
  ctx.font=`bold ${Math.min(14,8+z*3)|0}px system-ui`;ctx.fillStyle='#fff';ctx.fillText(c.name,x,y);ctx.font=`${Math.min(12,7+z*2.5)|0}px system-ui`;ctx.fillStyle='#ffe9a0';ctx.fillText('🪖'+Math.floor(c.tt),x,y+11)});
 else for(const r of R){const x=r.lx*z+vx,y=r.ly*z+vy;if(x<-50||x>cw+50||y<-20||y>ch+20)continue;ctx.font='bold 13px system-ui';ctx.fillStyle='#fff';ctx.fillText('🪖'+Math.floor(r.troops),x,y);
  const s=Object.keys(r.b).map(k=>r.b[k]?ICON[k]+r.b[k]:'').join('');ctx.font='11px system-ui';if(s)ctx.fillText(s,x,y+14);if(z>3.5){ctx.fillStyle='#cfe';ctx.fillText(r.name,x,y-14)}}
 for(const r of R)if(r.inv.length){const x=r.lx*z+vx,y=r.ly*z+vy,p=.5+.5*Math.sin(t*8);ctx.shadowBlur=0;ctx.fillStyle=`rgba(255,60,60,${.3+.3*p})`;ctx.beginPath();ctx.arc(x,y-18,12+4*p,0,7);ctx.fill();ctx.font='18px system-ui';ctx.fillStyle='#fff';ctx.fillText('⚔',x,y-18)}
 ctx.shadowBlur=0;if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.8})`;ctx.fillRect(0,0,cw,ch);flash-=dt*1.2}}
let last=performance.now(),T0=0;
function loop(n){const dt=Math.min(.1,(n-last)/1000);last=n;T0+=dt;
