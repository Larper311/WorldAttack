<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World at War</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06121f;color:#dfe8f2;font:13px system-ui,sans-serif;display:flex;height:100vh;overflow:hidden}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;gap:14px;align-items:center;padding:8px 12px;background:#0b2036;border-bottom:1px solid #1d3c5c;flex-wrap:wrap}
#top b{color:#ffd54a}
button{background:#1b4b7a;color:#fff;border:0;border-radius:5px;padding:6px 9px;cursor:pointer;font:inherit;margin:2px 2px 2px 0}
button:hover{background:#2a6aa8}button:disabled{opacity:.35;cursor:default}
#cv{flex:1;min-height:0;width:100%;display:block;background:#0a2a44;cursor:crosshair}
#log{height:96px;overflow:auto;background:#07182a;padding:6px 10px;font-size:12px;border-top:1px solid #1d3c5c}
#log .w{color:#ff8a80}#log .g{color:#8fe9b0}#log .n{color:#ffcc66}#log .x{color:#aaa}
#side{width:300px;background:#0b2036;border-left:1px solid #1d3c5c;padding:10px;overflow:auto;line-height:1.5}
#side h3{margin:4px 0}#side hr{border:0;border-top:1px solid #1d3c5c;margin:8px 0}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;flex-direction:column;font-size:30px;gap:16px;z-index:9}
@media(max-width:760px){body{flex-direction:column}#side{width:100%;height:38%;border-left:0}}
</style></head><body>
<div id="main"><div id="top"></div><canvas id="cv"></canvas><div id="log"></div></div>
<div id="side"></div><div id="ov"></div>
<script>
// name, power, nukes, polygon (lon,lat pairs) -- simplified real-world outlines
const D=[
["USA",5,3,[-125,49,-95,49,-83,46,-75,45,-67,45,-70,41,-76,35,-81,31,-80,25,-83,29,-90,30,-97,26,-104,29,-111,31,-117,32,-124,40]],
["Canada",3,0,[-125,49,-125,60,-125,70,-110,70,-90,68,-78,62,-62,58,-55,50,-67,45,-75,45,-83,46,-95,49]],
["Mexico",2,0,[-117,32,-111,31,-104,29,-97,26,-97,21,-91,19,-87,21,-89,15,-92,14,-105,20,-109,25,-114,30]],
["Colombia",1,0,[-77,8,-72,12,-67,6,-70,-4,-76,-1,-79,2]],
["Peru",1,0,[-81,-5,-76,-1,-70,-4,-70,-10,-69,-18,-76,-14]],
["Brazil",4,0,[-60,5,-50,2,-35,-5,-39,-15,-48,-26,-57,-30,-58,-20,-70,-10,-70,-4,-67,6]],
["Argentina",2,0,[-57,-30,-58,-38,-65,-42,-68,-52,-72,-50,-70,-30,-68,-22,-62,-22,-58,-26]],
["UK",4,2,[-5,50,1,51,0,54,-2,57,-5,58,-6,55,-3,54]],
["France",4,2,[-4,48,2,51,8,49,7,44,3,42,-2,43,-1,46]],
["Spain",2,0,[-9,43,-2,43,3,42,0,38,-5,36,-9,37]],
["Germany",4,0,[6,51,7,54,14,54,15,51,13,48,7,48]],
["Italy",3,0,[7,44,13,47,13,45,18,40,16,38,12,42,8,44]],
["Poland",2,0,[14,54,23,54,24,50,19,49,15,51]],
["Ukraine",2,0,[23,51,32,52,40,49,38,47,33,45,30,46,26,48]],
["Sweden",2,0,[5,60,12,66,20,70,28,70,24,65,18,60,12,56]],
["Turkey",3,0,[26,41,41,41,44,40,42,37,36,36,27,37]],
["Russia",5,3,[28,60,32,69,40,67,60,69,80,73,110,76,140,72,155,68,155,55,135,43,131,43,120,53,98,51,87,49,70,55,50,51,47,46,40,48,32,52,30,56]],
["Kazakhstan",2,0,[50,51,70,55,87,49,80,43,68,41,55,41,52,45]],
["China",5,3,[74,39,87,49,98,44,120,50,135,48,131,43,122,40,121,31,118,24,108,21,98,24,92,28,80,30]],
["Japan",4,0,[130,31,135,34,140,36,142,40,145,44,141,45,139,38,132,35]],
["India",4,2,[68,24,74,32,80,30,92,28,89,22,80,15,77,8,73,18]],
["Pakistan",3,1,[61,25,68,24,71,28,74,32,74,37,71,36,66,30]],
["Iran",3,0,[44,39,54,38,61,36,61,25,56,26,50,30,47,32,44,36]],
["Saudi Arabia",3,0,[35,29,44,30,48,29,52,24,56,22,43,13,39,20]],
["Egypt",2,0,[25,31,34,31,35,28,34,22,25,22]],
["Algeria",2,0,[-8,35,10,37,12,30,10,24,4,20,-5,25,-9,28]],
["Libya",1,0,[10,33,25,32,25,22,15,23,12,30]],
["Nigeria",2,0,[3,6,3,12,8,13,14,13,14,7,9,4]],
["Ethiopia",1,0,[34,9,38,15,43,12,48,8,42,4,36,4]],
["DR Congo",1,0,[12,-5,18,4,30,4,30,-10,24,-12,14,-8]],
["South Africa",3,0,[17,-29,20,-24,32,-23,32,-28,27,-34,19,-34]],
["Indonesia",3,0,[95,5,105,-6,115,-8.5,125,-9,141,-3,135,-1,118,1,108,2]],
["Australia",3,0,[114,-22,130,-12,142,-11,146,-19,153,-27,150,-37,140,-38,130,-32,115,-34]]
];
const W=1120,H=492;
const C=D.map((d,i)=>{const p=[];for(let k=0;k<d[3].length;k+=2)p.push([(d[3][k]+125)*4,(78-d[3][k+1])*4]);
 let sx=0,sy=0;p.forEach(q=>{sx+=q[0];sy+=q[1]});
 return{id:i,name:d[0],power:d[1],p,cx:sx/p.length,cy:sy/p.length,owner:i,money:600+d[1]*150,troops:30+d[1]*30,
 missiles:d[1]>3?2:0,nukes:d[2],mine:1,fact:1,shield:d[1]>3?1:0,allies:new Set,war:new Set,cd:0,rad:0,inf:0,dn:{},col:`hsl(${i*47%360},50%,40%)`}});
// neighbours (land borders / short sea gaps)
const dp=C.map(c=>{const o=[];c.p.forEach((a,i)=>{const b=c.p[(i+1)%c.p.length],n=Math.ceil(Math.hypot(a[0]-b[0],a[1]-b[1])/14);for(let k=0;k<n;k++)o.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n])});return o});
const N=C.map(()=>C.map(()=>0));
for(let i=0;i<C.length;i++)for(let j=i+1;j<C.length;j++){let m=1e9;for(const a of dp[i])for(const b of dp[j]){const d=(a[0]-b[0])**2+(a[1]-b[1])**2;if(d<m)m=d}N[i][j]=N[j][i]=m<676?1:0}
let P=null,sel=null,day=0,speed=0,over=0,fx=[],q=[],flash=0,acc=0;
const L=document.getElementById('log'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const terr=a=>C.filter(c=>c.owner===a),alive=a=>C[a].owner===a;
const adj=(a,b)=>terr(a).some(x=>terr(b).some(y=>N[x.id][y.id]));
const adjT=(a,t)=>terr(a).some(x=>N[x.id][t]);
const str=a=>C[a].troops+C[a].missiles*15+C[a].nukes*120+terr(a).length*10;
const inc=a=>Math.round(terr(a).reduce((s,t)=>s+(t.rad>0?0:3+t.power*2),0)+C[a].mine*14);
const cost=(k,A)=>Math.round({mine:180,fact:220,shield:260}[k]*(1+.35*A[k]));
function log(m,c=''){const d=document.createElement('div');d.textContent=`[Day ${day}] ${m}`;d.className=c;L.prepend(d);while(L.children.length>80)L.lastChild.remove()}
function build(a,k){const A=C[a],c=cost(k,A);if(A.money<c)return 0;A.money-=c;A[k]++;return 1}
function recruit(a){const A=C[a];if(A.money<50)return 0;A.money-=50;A.troops+=12;return 1}
function buy(a,k){const A=C[a],c=k=='nuke'?2000:250;if(A.money<c)return 0;A.money-=c;A[k=='nuke'?'nukes':'missiles']++;return 1}
// diplomacy
function ally(a,b){C[a].allies.add(b);C[b].allies.add(a)}
function unally(a,b){C[a].allies.delete(b);C[b].allies.delete(a)}
function evalAlly(f,t){const F=C[f],T=C[t];if(T.war.has(f))return 0;let s=.3;
 for(const w of T.war)if(F.war.has(w))s+=.3;
 if(adj(f,t))s+=.05;s-=F.inf*.15;if(T.allies.size>4)s-=.2;if(str(f)>str(t))s+=.1;if(T.war.size&&!F.war.size)s-=.1;
 return Math.max(.03,Math.min(.85,s))}
function peace(a,b){C[a].war.delete(b);C[b].war.delete(a);log(`🕊 Ceasefire: ${C[a].name} & ${C[b].name}`,'g')}
function warOn(a,b){const A=C[a],B=C[b];if(A.war.has(b))return;
 if(A.allies.has(b)){unally(a,b);A.inf++;log(`💔 ${A.name} betrayed ${B.name}!`,'w')}
 A.war.add(b);B.war.add(a);log(`⚔ ${A.name} declared war on ${B.name}`,'w');
 for(const x of [...B.allies])if(x!==a&&alive(x)&&Math.random()<.85){log(`🛡 ${C[x].name} defends ${B.name}`,'n');warOn(x,a)}
 for(const x of [...A.allies])if(x!==b&&alive(x)&&!B.allies.has(x)&&Math.random()<.5){log(`🤝 ${C[x].name} joins ${A.name}`,'n');warOn(x,b)}}
// combat
function attack(a,tid){const t=C[tid],e=t.owner,A=C[a],E=C[e];
 if(a===e)return'x';if(A.cd>0)return'Troops still regrouping';if(A.troops<5)return'Not enough troops';
 if(!adjT(a,tid))return'Target not adjacent to your territory';
 if(!A.war.has(e))warOn(a,e);
 const sent=Math.floor(A.troops*.7),n=terr(e).length,from=terr(a).find(x=>N[x.id][tid])||A;
 const att=sent*(.85+Math.random()*.3),def=E.troops*(1.15+.06*E.shield)/Math.sqrt(n);A.cd=3;
 q.push({k:'a',x1:from.cx,y1:from.cy,x2:t.cx,y2:t.cy,t:0,d:1.2,cb:()=>{
  if(!alive(e)&&t.owner!==e)return;
  if(att>def){A.troops-=Math.min(sent,Math.ceil(def*.7));const cap=tid===e;
   if(cap){terr(e).forEach(x=>x.owner=a);A.money+=E.money*.5;A.mine+=Math.floor(E.mine/2);A.fact+=Math.floor(E.fact/2);A.missiles+=E.missiles;A.nukes+=E.nukes;
    E.money=E.troops=E.missiles=E.nukes=0;C.forEach(c=>{c.allies.delete(e);c.war.delete(e)});E.allies.clear();E.war.clear();
    log(`🏴 ${E.name} has FALLEN to ${A.name}!`,'w')}
   else{E.troops*=.55;t.owner=a;log(`🚩 ${A.name} captured ${t.name} from ${E.name}`,'w')}}
  else{A.troops-=Math.ceil(sent*.7);E.troops=Math.max(0,E.troops-att*.4);log(`🛡 ${E.name} repelled ${A.name}'s invasion of ${t.name}`,'n')}
  ui()}});return''}
function fire(a,tid,nuke){const A=C[a],e=C[tid].owner,E=C[e];
 if(nuke?A.nukes<1:A.missiles<1)return'None left';if(!A.war.has(e))warOn(a,e);
 nuke?A.nukes--:A.missiles--;
 q.push({k:nuke?'n':'m',x1:A.cx,y1:A.cy,x2:C[tid].cx,y2:C[tid].cy,t:0,d:nuke?2.4:1.5,cb:()=>{
  const ic=nuke?Math.min(.5,.1*E.shield):Math.min(.7,.15*E.shield);
  if(!alive(e))return;
  if(Math.random()<ic){log(`🛰 ${E.name} intercepted a ${nuke?'NUKE':'missile'} from ${A.name}!`,'g');q.push({k:'b',x1:C[tid].cx,y1:C[tid].cy-30,t:0,d:.6,R:10});return}
  q.push({k:'b',x1:C[tid].cx,y1:C[tid].cy,t:0,d:nuke?2:.9,R:nuke?45:14});
  if(nuke){E.troops*=.45;E.mine=Math.floor(E.mine/2);E.fact=Math.floor(E.fact/2);E.shield=Math.floor(E.shield/2);E.money*=.6;C[tid].rad=40;A.inf+=2;flash=1;
   log(`☢ ${A.name} NUKED ${C[tid].name}! The world is horrified.`,'w')}
  else{E.troops*=.88;if(Math.random()<.5){const k=['mine','fact','shield'].filter(z=>E[z]>0)[0|Math.random()*3]||'';if(k)E[k]--}
   log(`🚀 ${A.name}'s missile hit ${C[tid].name}`,'n')}
  ui()}});return''}
// AI
function aiTurn(a){const A=C[a];
 for(let i=0;i<3;i++){const r=Math.random();
  if(r<.35&&A.money>cost('mine',A))build(a,'mine');else if(r<.6&&A.money>cost('fact',A))build(a,'fact');
  else if(r<.72&&A.money>cost('shield',A))build(a,'shield');else if(r<.88&&A.money>150)recruit(a);
  else if(A.power>=3&&A.money>700&&Math.random()<.3)buy(a,'missile');else if(A.power>=4&&A.money>2800&&Math.random()<.1)buy(a,'nuke')}
 if(Math.random()<.05){const cs=C.filter(c=>alive(c.id)&&c.id!==a&&!A.allies.has(c.id)&&!A.war.has(c.id));const t=cs[0|Math.random()*cs.length];
  if(t){if(t.id===P){if(!over&&confirm(`${A.name} proposes an alliance. Accept?`)){ally(a,P);log(`🤝 You allied with ${A.name}`,'g')}}
   else if(Math.random()<evalAlly(a,t.id)*evalAlly(t.id,a)*1.6){ally(a,t.id);log(`🤝 ${A.name} & ${t.name} formed an alliance`,'g')}}}
 if(!A.war.size&&day>8&&Math.random()<.035){const tg=C.filter(c=>alive(c.id)&&c.id!==a&&!A.allies.has(c.id)&&adj(a,c.id)).sort((x,y)=>str(x.id)-str(y.id))[0];
  if(tg&&str(a)>str(tg.id)*1.3)warOn(a,tg.id)}
 if(A.war.size){
  if(A.cd<=0&&A.troops>20){let b=null,br=1.2;for(const e of A.war){if(!alive(e))continue;for(const t of terr(e))if(adjT(a,t.id)){
    const r=A.troops*.66/(C[e].troops*(1.15+.06*C[e].shield)/Math.sqrt(terr(e).length)+1);if(r>br){br=r;b=t.id}}}
   if(b!==null)attack(a,b)}
  const en=[...A.war].filter(alive);if(en.length){
   if(A.missiles>0&&Math.random()<.4)fire(a,en[0|Math.random()*en.length],0);
   if(A.nukes>0&&Math.random()<.1){const s=en.sort((x,y)=>str(y)-str(x))[0];fire(a,s,1)}
   for(const e of en)if(str(a)<str(e)*.6&&Math.random()<.08){
    if(e===P){if(!over&&confirm(`${A.name} requests a ceasefire. Accept?`))peace(a,P)}
    else if(Math.random()<.5)peace(a,e)}}}}
function tick(){day++;
 C.forEach(c=>{if(c.cd>0)c.cd--;if(c.rad>0)c.rad--;if(alive(c.id)){c.money+=inc(c.id);c.troops+=terr(c.id).length+c.fact*2.5}});
 C.forEach(c=>{if(alive(c.id)&&c.id!==P)aiTurn(c.id)});check();ui()}
function end(m){over=1;speed=0;const o=document.getElementById('ov');o.style.display='flex';o.innerHTML=`<div>${m}</div><button onclick="location.reload()" style="font-size:18px;padding:10px 18px">Play again</button>`}
function check(){if(P===null||over)return;if(!alive(P))return end('💀 Your nation has fallen.');
 if(C.filter(c=>alive(c.id)&&c.id!==P).every(c=>C[P].allies.has(c.id)))end('🏆 Victory! The world is yours.')}
// player actions
function act(k){if(P===null||over||sel===null)return;const t=C[sel],e=t.owner,p=C[P],E=C[e],no=m=>log(m,'x');
 if(e===P){if(['mine','fact','shield'].includes(k))build(P,k)||no('Not enough money');
  else if(k=='rec')recruit(P)||no('Not enough money');else if(k=='bm')buy(P,'missile')||no('Not enough money');else if(k=='bn')buy(P,'nuke')||no('Not enough money')}
 else if(k=='ally'){if(E.dn[P]>day)no(`${E.name} refuses to talk yet.`);
  else if(Math.random()<evalAlly(P,e)){ally(P,e);log(`🤝 ${E.name} ACCEPTED your alliance!`,'g')}
  else{E.dn[P]=day+8;log(`❌ ${E.name} DENIED your alliance.`,'w')}}
 else if(k=='peace'){if(Math.random()<(str(e)<str(P)*1.2?.55:.25)+(E.war.size>1?.15:0))peace(P,e);else log(`❌ ${E.name} rejects a ceasefire.`,'w')}
 else if(k=='call'){let n=0;for(const x of p.allies)if(!C[x].war.has(e)&&x!==e){n++;if(Math.random()<.45+(str(x)>str(e)?.2:0)){log(`🤝 ${C[x].name} joins your war on ${E.name}`,'g');warOn(x,e)}else log(`❌ ${C[x].name} declines to fight ${E.name}`,'w')}if(!n)no('No allies to call')}
 else{if(p.allies.has(e)&&!confirm(`Betray your ally ${E.name}?`))return;
  const r=k=='att'?attack(P,sel):fire(P,sel,k=='nuk');if(r&&r!=='x')no(r)}
 ui()}
const B=(l,f,d)=>`<button ${d?'disabled':''} onclick="act('${f}')">${l}</button>`;
const nm=s=>[...s].filter(alive).map(i=>C[i].name).join(', ')||'none';
function ui(){const T=document.getElementById('top'),S=document.getElementById('side');
 if(P===null){T.innerHTML='<b>🌍 WORLD AT WAR</b> — click a country on the map to take command';
  S.innerHTML=`<h3>How to play</h3>• Pick a country.<br>• 💰 Earn money from land and Mines. Build Mines, Factories (troops), Shields (missile defence + stronger defence).<br>• Select other countries: propose an <b>alliance</b> (they may deny!), ask allies to join wars, invade neighbours, fire 🚀 missiles or ☢ nukes (anywhere).<br>• Conquer a capital to eliminate a nation. Nukes make everyone hate you.<br>• Win by conquering or allying with every nation.`;return}
 const p=C[P];T.innerHTML=`<b>${p.name}</b><span>Day ${day}</span><span>💰 <b>$${Math.floor(p.money)}</b> (+${inc(P)}/day)</span><span>🪖 ${Math.floor(p.troops)}</span><span>🚀 ${p.missiles}</span><span>☢ ${p.nukes}</span><span style="margin-left:auto"></span>`+
  [0,1,2,4].map(s=>`<button style="${s==speed?'background:#c98a00':''}" onclick="speed=${s};ui()">${s?s+'x':'⏸'}</button>`).join('');
 let h=`<b>Your empire</b><br>Territories ${terr(P).length} · Mines ${p.mine} · Factories ${p.fact} · Shields ${p.shield}<br>Allies: ${nm(p.allies)}<br>At war: ${nm(p.war)}<hr>`;
 if(sel!==null){const t=C[sel],e=t.owner,E=C[e];h+=`<h3>${t.name}${e!==t.id?` <small>(held by ${E.name})</small>`:''}${t.rad>0?' ☢':''}</h3>`;
  if(e===P){h+=`${B(`⛏ Mine $${cost('mine',p)} (+$14/d)`,'mine')}<br>${B(`🏭 Factory $${cost('fact',p)} (+troops)`,'fact')}<br>${B(`🛡 Shield $${cost('shield',p)}`,'shield')}<br>${B('🪖 Recruit +12 troops $50','rec')}<br>${B('🚀 Missile $250','bm')}<br>${B('☢ Nuke $2000','bn')}`}
  else{const rel=p.allies.has(e)?'🤝 Ally':p.war.has(e)?'⚔ AT WAR':'Neutral';
   h+=`${rel}<br>Troops ${Math.floor(E.troops)} · 🚀 ${E.missiles} · ☢ ${E.nukes} · Shields ${E.shield}<br>Allies: ${nm(E.allies)}<br>At war: ${nm(E.war)}<br><br>`+
   B('🤝 Propose alliance','ally',p.allies.has(e)||p.war.has(e))+B('🕊 Ceasefire','peace',!p.war.has(e))+'<br>'+
   B(`⚔ Invade (${Math.floor(p.troops*.7)} troops)${p.cd>0?' ⏳'+p.cd:''}`,'att',p.cd>0||!adjT(P,sel))+B('📣 Call allies to war','call',!p.allies.size)+'<br>'+
   B(`🚀 Missile (${p.missiles})`,'mis',!p.missiles)+B(`☢ Nuke (${p.nukes})`,'nuk',!p.nukes)}}
 S.innerHTML=h}
// rendering
let sc=1,ox=0,oy=0;
function resize(){const d=devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;sc=Math.min(cv.clientWidth/W,cv.clientHeight/H);ox=(cv.clientWidth-W*sc)/2;oy=(cv.clientHeight-H*sc)/2}
addEventListener('resize',resize);
const pip=(x,y,p)=>{let c=0;for(let i=0,j=p.length-1;i<p.length;j=i++){if((p[i][1]>y)!=(p[j][1]>y)&&x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0])c=!c}return c};
cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left-ox)/sc,y=(e.clientY-r.top-oy)/sc;
 const t=[...C].reverse().find(c=>pip(x,y,c.p));if(!t)return;sel=t.id;
 if(P===null){P=t.id;speed=1;log(`You now command ${t.name}. Good luck.`,'g')}ui()};
function path(p){ctx.beginPath();p.forEach((a,i)=>i?ctx.lineTo(a[0],a[1]):ctx.moveTo(a[0],a[1]));ctx.closePath()}
function draw(dt,t){const d=devicePixelRatio||1;ctx.setTransform(d,0,0,d,0,0);
 const g=ctx.createLinearGradient(0,0,0,cv.clientHeight);g.addColorStop(0,'#0b3a5e');g.addColorStop(1,'#07243c');ctx.fillStyle=g;ctx.fillRect(0,0,cv.clientWidth,cv.clientHeight);
 ctx.setTransform(d*sc,0,0,d*sc,d*ox,d*oy);
 ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=.5;for(let x=0;x<=W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<=H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.lineJoin='round';
 C.forEach(c=>{path(c.p);ctx.fillStyle=C[c.owner].col;ctx.fill();
  if(c.rad>0){ctx.fillStyle=`rgba(170,255,0,${.3+.15*Math.sin(t*4)})`;ctx.fill()}
  const o=c.owner;ctx.lineWidth=.8;ctx.strokeStyle='rgba(0,0,0,.55)';
  if(P!==null){if(o===P){ctx.strokeStyle='#ffd54a';ctx.lineWidth=2}else if(C[P].allies.has(o)){ctx.strokeStyle='#5f8';ctx.lineWidth=2}else if(C[P].war.has(o)){ctx.strokeStyle='#f55';ctx.lineWidth=2}}
  ctx.stroke()});
 if(sel!==null){path(C[sel].p);ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.stroke()}
 ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(130,255,170,.35)';ctx.lineWidth=1;
 C.forEach(a=>{if(alive(a.id))a.allies.forEach(b=>{if(b>a.id&&alive(b)){ctx.beginPath();ctx.moveTo(a.cx,a.cy);ctx.lineTo(C[b].cx,C[b].cy);ctx.stroke()}})});
 ctx.setLineDash([]);ctx.textAlign='center';
 C.forEach(c=>{if(alive(c.id)){ctx.font='bold 9px system-ui';ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=3;ctx.fillText(c.name,c.cx,c.cy);ctx.font='9px system-ui';ctx.fillStyle='#ffe9a0';ctx.fillText('🪖'+Math.floor(c.troops),c.cx,c.cy+10);ctx.shadowBlur=0}});
 fx=fx.concat(q);q=[];
 fx=fx.filter(f=>{f.t+=dt;const p=Math.min(1,f.t/f.d);
  if(f.k=='a'){ctx.strokeStyle='rgba(255,80,80,.7)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo(f.x2,f.y2);ctx.stroke();ctx.setLineDash([]);
   ctx.fillStyle='#fff';for(let i=0;i<4;i++){const u=Math.max(0,p-i*.05);ctx.fillRect(f.x1+(f.x2-f.x1)*u-2,f.y1+(f.y2-f.y1)*u-2,4,4)}}
  else if(f.k=='m'||f.k=='n'){const x=f.x1+(f.x2-f.x1)*p,y=f.y1+(f.y2-f.y1)*p-Math.sin(Math.PI*p)*(f.k=='n'?70:45);
   for(let i=1;i<8;i++){const u=Math.max(0,p-i*.02),tx=f.x1+(f.x2-f.x1)*u,ty=f.y1+(f.y2-f.y1)*u-Math.sin(Math.PI*u)*(f.k=='n'?70:45);ctx.fillStyle=`rgba(255,${f.k=='n'?120:200},60,${.5-i*.06})`;ctx.beginPath();ctx.arc(tx,ty,3-i*.25,0,7);ctx.fill()}
   ctx.fillStyle=f.k=='n'?'#ff4':'#fff';ctx.beginPath();ctx.arc(x,y,f.k=='n'?4:2.5,0,7);ctx.fill()}
  else if(f.k=='b'){ctx.fillStyle=`rgba(255,${180-120*p},40,${1-p})`;ctx.beginPath();ctx.arc(f.x1,f.y1,f.R*p,0,7);ctx.fill();ctx.strokeStyle=`rgba(255,255,255,${1-p})`;ctx.beginPath();ctx.arc(f.x1,f.y1,f.R*p*1.3,0,7);ctx.stroke()}
  if(f.t>=f.d){f.cb&&f.cb();return false}return true});
 if(flash>0){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=`rgba(255,255,255,${flash*.8})`;ctx.fillRect(0,0,cv.width,cv.height);flash-=dt*1.2}}
let last=performance.now(),T0=0;
function loop(n){const dt=Math.min(.1,(n-last)/1000);last=n;T0+=dt;
 if(speed&&!over){acc+=dt*speed;while(acc>=1){acc-=1;tick()}}
 draw(dt,T0);requestAnimationFrame(loop)}
resize();ui();log('Choose your nation by clicking it on the map.','n');requestAnimationFrame(loop);
</script></body></html>
