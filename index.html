<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World at War 6 — Grand Strategy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050d17;color:#e4edf6;font:13px/1.45 "Segoe UI",system-ui,sans-serif;display:flex;height:100vh;overflow:hidden}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#hud{display:flex;gap:7px;align-items:center;padding:7px 12px;background:linear-gradient(#0f2237,#0a1827);border-bottom:1px solid #1f3b5a;flex-wrap:wrap;box-shadow:0 2px 10px #0008;z-index:7}
#hud b{color:#ffd54a}
.tag{background:linear-gradient(#15304c,#10253b);padding:3px 9px;border-radius:6px;font-size:12px;border:1px solid #23446a;display:inline-block}
#wrap{flex:1;position:relative;min-height:0;background:#07233c;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
#cv:active{cursor:grabbing}
#mini{position:absolute;right:12px;top:12px;width:230px;height:120px;border:1px solid #2f5273;border-radius:7px;z-index:6;cursor:crosshair;background:#07233c;opacity:.95;box-shadow:0 4px 14px #0009}
#tip{position:absolute;pointer-events:none;background:#06121fee;padding:7px 11px;border-radius:8px;display:none;font-size:12px;line-height:1.5;border:1px solid #2f5273;max-width:270px;z-index:5;box-shadow:0 4px 14px #0009}
#zb{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
button{background:linear-gradient(#2062a0,#1a4a7a);color:#fff;border:0;border-radius:6px;padding:5px 11px;cursor:pointer;font:inherit;transition:background .12s,transform .08s;box-shadow:0 1px 3px #0006}
button:hover{background:linear-gradient(#2e78bf,#2766a3)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.35;cursor:default;transform:none}
button.on{background:linear-gradient(#e0a010,#c48a00)}
button.ab{background:linear-gradient(#8a36a8,#6d2a86)}
#log{height:78px;overflow:auto;background:#050d17;padding:5px 12px;font-size:11.5px;border-top:1px solid #1b3350;scrollbar-width:thin}
#log .w{color:#ff8a80}#log .g{color:#8fe9b0}#log .n{color:#ffcc66}#log .x{color:#9ab}
#side{width:345px;background:linear-gradient(#0c1a2b,#09141f);border-left:1px solid #1f3b5a;padding:11px;overflow:auto;line-height:1.5;scrollbar-width:thin}
#side h3{margin:0 0 6px;font-size:14px;color:#ffd54a}
#side hr{border:0;border-top:1px solid #1b3350;margin:9px 0}
.row{padding:6px 0;border-bottom:1px solid #132639}
.bar{height:5px;background:#1a3048;border-radius:3px;margin:4px 0;overflow:hidden}
.bar i{display:block;height:100%}
.pips{letter-spacing:2px;color:#ffd54a}
#md{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(2px)}
#mc{background:linear-gradient(#112a44,#0b1e32);border:1px solid #3f739f;border-radius:13px;padding:22px 26px;max-width:480px;text-align:center;line-height:1.55;box-shadow:0 14px 44px #000c}
#mc h2{margin:0 0 10px;font-size:20px}
#mc button{font-size:14px;padding:8px 16px;margin:8px 4px 0}
#toasts{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:15;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.ts{background:#0d2740ee;border:1px solid #3a6a9a;padding:7px 16px;border-radius:8px;font-size:13px;box-shadow:0 4px 14px #0008}
.ts.w{border-color:#e55}.ts.g{border-color:#5c8}
.lb-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #132639;font-size:12px}
.lb-rank{width:24px;color:#8ab;font-weight:600}.lb-name{flex:1}.lb-val{color:#ffd54a}
#settings{position:absolute;right:12px;bottom:12px;z-index:6}
#setPanel{display:none;position:absolute;right:0;bottom:44px;background:#0c1e32f2;border:1px solid #2a4a6a;border-radius:9px;padding:10px 14px;min-width:220px}
#setPanel label{display:flex;align-items:center;gap:8px;margin:7px 0;cursor:pointer}
#load{position:fixed;inset:0;background:#050d17;z-index:50;display:flex;align-items:center;justify-content:center;font-size:18px;color:#9cc}
@media(max-width:900px){body{flex-direction:column}#side{width:100%;height:36%;border-left:0;border-top:1px solid #1b3350}#mini{width:150px;height:78px}}
</style>
</head>
<body>
<div id="load">Generating world…</div>
<div id="main">
  <div id="hud"></div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <canvas id="mini" width="230" height="120"></canvas>
    <div id="tip"></div>
    <div id="zb">
      <button onclick="zoomAt(cw/2,ch/2,1.4)">＋</button>
      <button onclick="zoomAt(cw/2,ch/2,1/1.4)">－</button>
      <button onclick="fit()">⌂</button>
    </div>
    <div id="settings">
      <button onclick="toggleSettings()">⚙️</button>
      <div id="setPanel">
        <label><input type="checkbox" checked onchange="settings.dipRequests=this.checked"> Diplomacy requests</label>
        <label><input type="checkbox" checked onchange="settings.terrain=this.checked;dirtyAll=1"> Terrain shading</label>
        <label><input type="checkbox" checked onchange="settings.labels=this.checked"> Country labels</label>
        <label><input type="checkbox" checked onchange="settings.effects=this.checked"> Combat effects</label>
        <label><input type="checkbox" checked onchange="settings.sound=this.checked"> Sound</label>
      </div>
    </div>
  </div>
  <div id="log"></div>
</div>
<div id="side"></div>
<div id="md"><div id="mc"></div></div>
<div id="toasts"></div>

  if (A.pw >= 3 && A.money > 600 && Math.random() < .05) { A.money -= 180; A.planes++; }

  const nb = [...new Set(rs.flatMap(r => r.nb.map(z => Rg[z[0]].o)))].filter(x => x !== o && C[x].alive);
  if (nb.length && day % 8 === o % 8) { const x = nb[rnd(nb.length)]; A.rel[x] += Math.random() * 5 - 3; }

  if (A.war.size < 2 && day > 20 && Math.random() < .005 + .012 * A.ag) {
    const rivals = (RIVALS[A.name] || []).map(n => C.find(c => c.name === n)).filter(c => c && c.alive && !A.al.has(c.id) && !A.war.has(c.id));
    let targets = nb.filter(x => !A.al.has(x) && A.rel[x] < 18 && str(o) + [...A.al].reduce((s, z) => s + str(z), 0) > 1.3 * (str(x) + [...C[x].al].reduce((s, z) => s + str(z), 0)));
    if (rivals.length && Math.random() < .5) targets = rivals.map(c => c.id).filter(id => targets.includes(id) || Math.random() < .35);
    if (targets.length) warOn(o, targets[rnd(targets.length)]);
  }
  if (A.war.size) {
    const dist = new Map(), q = [];
    rs.forEach(r => { if (r.nb.some(z => A.war.has(Rg[z[0]].o))) { dist.set(r.i, 0); q.push(r); } });
    for (let h = 0; h < q.length; h++) { const r = q[h]; r.nb.forEach(([j]) => { const n = Rg[j]; if (n.o === o && !dist.has(j)) { dist.set(j, dist.get(r.i) + 1); q.push(n); } }); }
    let n = 0;
    for (const r of rs) {
      const d = dist.get(r.i);
      if (d > 0 && r.troops > 14 && n < 8) { const b = r.nb.map(z => Rg[z[0]]).find(x => x.o === o && dist.get(x.i) < d); if (b) { send(r.i, b.i, .5); n++; } }
    }
    let at = 0;
    for (const f of rs) {
      if (f.troops < 16 || at >= 3) continue;
      let bt = null, br = 1.3;
      for (const [j] of f.nb) { const t = Rg[j]; if (!A.war.has(t.o)) continue; const ra = (f.troops * .7 * (1 + .08 * tl(o, 'arm'))) / (t.troops * defm(t) + 4); if (ra > br) { br = ra; bt = t; } }
      if (bt) { send(f.i, bt.i, .7); at++; }
    }
    const en = [...A.war].filter(x => C[x].alive);
    if (A.planes > 0 && Math.random() < .12 && en.length) {
      const er = own(en[rnd(en.length)]);
      if (er.length) { const tgt = er.slice().sort((x, y) => y.troops - x.troops)[0], src = rs.filter(r => r.troops > 20).sort((a, b) => b.troops - a.troops)[0]; if (src) airlift(src.i, tgt.i, .4); }
    }
    if (en.length) {
      const er = own(en[rnd(en.length)]);
      if (A.mis > 0 && Math.random() < .08 && er.length) launch(o, er.slice().sort((x, y) => y.troops - x.troops)[0].i, 0);
      if (A.nuk > 0 && A.ag > .72 && Math.random() < .015 && er.length) launch(o, er[rnd(er.length)].i, 1);
      for (const e of en) {
        if (day - A.lastPeaceOffer < 28) continue;
        const wantPeace = (str(o) < str(e) * .5 && Math.random() < .035) || Math.random() < .004 || (A.war.size > 1 && Math.random() < .025);
        if (wantPeace) {
          A.lastPeaceOffer = day;
          if (e === P && settings.dipRequests) ask('🕊 Ceasefire offer', `<b>${A.name}</b> asks for a ceasefire.`, [{ l: 'Accept', fn: () => peace(o, P) }, { l: 'Refuse' }]);
          else if (Math.random() < .4) peace(o, e);
        }
      }
    }
  }
  if (settings.dipRequests && Math.random() < .005 && day - A.lastAllyOffer > 28 && P !== null && C[P].alive && !A.war.has(P) && !A.al.has(P) && A.rel[P] >= 50 && A.al.size < 3 && C[P].al.size < 3) {
    A.lastAllyOffer = day;
    ask('🤝 Alliance offer', `<b>${A.name}</b> proposes a military alliance.`, [{ l: 'Accept', fn: () => { ally(o, P); log(`🤝 You allied with ${A.name}`, 'g', 1); } }, { l: 'Decline' }]);
  } else if (Math.random() < .004 && A.al.size < 3) {
    const t = C.find(c => c.alive && c.id !== o && c.id !== P && !A.al.has(c.id) && !A.war.has(c.id) && c.al.size < 3 && A.rel[c.id] > 48 && c.rel[o] > 48);
    if (t) { ally(o, t.id); log(`🤝 ${A.name} & ${t.name} formed an alliance`, 'g'); }
  }
}

function daily() {
  day++; calcStr();
  const mob = day <= mobEnd;
  Rg.forEach(r => {
    const A = C[r.o];
    if (r.rad > 0) { r.rad--; r.troops *= .982; if (r.rad === 0) dirtyR.add(r.i); return; }
    if (r.un > 0) r.un--;
    else {
      A.money += inc(r);
      if (r.troops < tcap(r)) r.troops += (.13 + r.b.fact * 1.3 + (r.i === A.cap ? .6 : 0) + (r.b.air ? .2 : 0)) * (1 + .18 * tl(r.o, 'mil'));
      if (mob && r.o === P && r.troops < tcap(r) * 1.25) r.troops += 1.1;
    }
    if (r.o !== r.c && C[r.c].alive && r.troops < 5 && !r.inv.length && Math.random() < .006) {
      log(`✊ ${r.nm} rose up and returned to ${C[r.c].name}!`, 'n', 1);
      const old = C[r.o]; setOwner(r, r.c); r.troops = 9;
      if (!own(old.id).length) { old.alive = 0; lblDirty = 1; }
    }
  });
  Rg.forEach(r => { if (r.inv.length) battle(r); });
  C.forEach(c => {
    if (!c.alive) return;
    if (c.id !== P && day % G[diff] === c.id % G[diff]) ai(c.id);
    for (const w of c.war) c.rel[w] = Math.max(-100, c.rel[w] - .95);
    for (const a of c.al) c.rel[a] = Math.min(100, c.rel[a] + .13);
    for (const x of c.war) for (const w of C[x].war) if (w !== c.id && !c.war.has(w)) c.rel[w] = Math.min(100, c.rel[w] + .28);
    if (c.id === P) C.forEach(x => { if (x.alive && x.id !== P && !c.war.has(x.id)) x.rel[P] = Math.min(100, x.rel[P] + .045); });
  });
  events(); check(); ui();
}
function events() {
  if (day < nextEv || P === null) return;
  nextEv = day + 16 + rnd(20);
  const r = Rg[rnd(Rg.length)], o = C[r.o], k = rnd(3);
  if (k === 0) { r.troops *= .8; rings.push({ x: r.cx, y: r.cy, R: 40, col: '#c9a070', t: 0, d: 1 }); log(`🌋 Earthquake in ${r.nm}: ${o.name} loses troops`, 'n', r.o === P); }
  else if (k === 1) { r.b.mine = Math.min(3, r.b.mine + 1); o.money += 200; log(`💎 Mineral discovery in ${r.nm}: ${o.name} gains $200 and a mine`, 'g', r.o === P); }
  else { r.troops += 18; log(`🪖 Volunteers rally in ${r.nm} (${o.name})`, 'g', r.o === P); }
}
function end(w) {
  over = 1; speed = 0;
  ask(w ? '🏆 Victory!' : '💀 Your nation has fallen', w ? `You control ${WIN}+ regions and dominate the world.` : 'Your last region was captured.', [{ l: 'Play again', fn: () => location.reload() }]);
}
function check() {
  if (over || P === null) return;
  if (!C[P].alive) return end(0);
  if (own(P).length >= WIN || C.every(c => c.id === P || !c.alive)) end(1);
}

function build(k) {
  const r = Rg[sel]; if (!r || r.o !== P) return; const c = cost(k, r);
  if (r.b[k] >= maxB(k) || C[P].money < c) return log('Cannot build that', 'x');
  C[P].money -= c; r.b[k]++; ui();
}
function recruit(n, c) { const r = Rg[sel]; if (!r || r.o !== P || C[P].money < c) return log('Not enough money', 'x'); C[P].money -= c; r.troops += n; ui(); }
function go(f, t, fr) { const e = send(f, t, fr); if (e) log(e, 'x', 1); ui(); }
function act(f, t) {
  const to = Rg[t].o, p = C[P];
  if (to === P || p.war.has(to)) return go(f, t, frac);
  if (p.al.has(to)) return ask('Betray ally?', `Attack your ally <b>${C[to].name}</b>? Everyone will trust you less.`, [{ l: 'Betray', fn: () => go(f, t, frac) }, { l: 'Cancel' }]);
  ask('Declare war?', `Attack <b>${C[to].name}</b>? This declares war (their allies may join).`, [{ l: 'Declare war', fn: () => go(f, t, frac) }, { l: 'Cancel' }]);
}
function doAir(f, t) { const e = airlift(f, t, frac); if (e) log(e, 'x', 1); ui(); }
function missile(nk) { const e = launch(P, sel, nk); if (e) log(e, 'x', 1); ui(); }
function buy(k) {
  const costs = { nuk: 1750, mis: 250, plane: 180 }, c = costs[k], A = C[P];
  if (k === 'nuk' && !NUKES.has(A.name)) return log('Only nuclear powers can build nukes', 'x', 1);
  if (A.money < c) return log('Not enough money', 'x');
  A.money -= c; if (k === 'nuk') A.nuk++; else if (k === 'mis') A.mis++; else A.planes++; ui();
}
function research(k) {
  const A = C[P], l = A.tech[k];
  if (l >= 3) return; if (A.money < TC[l]) return log('Not enough money', 'x');
  A.money -= TC[l]; A.tech[k]++; log(`🔬 Research complete: ${TECH[k].n} ${A.tech[k]}`, 'g', 1); ui();
}
function mobilize() {
  if (day < mobCd) return log('Mobilization cooling down', 'x', 1);
  if (C[P].money < 300) return log('Need $300', 'x', 1);
  C[P].money -= 300; mobEnd = day + 10; mobCd = day + 40;
  log('📣 National mobilization: troop production surges for 10 days', 'g', 1); ui();
}
function dip(k, id) {
  const p = C[P], t = C[id];
  if (k === 'gift') {
    if (p.money < 150) return log('Not enough money', 'x');
    p.money -= 150; t.rel[P] = Math.min(100, t.rel[P] + 10); log(`🎁 ${t.name} appreciates your gift (trust ${t.rel[P] | 0})`, 'g');
  } else if (k === 'ally') {
    if (t.dn[P] > day) log(`${t.name} won't talk until ${dateStr(t.dn[P])}`, 'x', 1);
    else {
      const [pr, why] = allyCheck(P, id);
      if (!pr) log(`❌ ${t.name} ${why}`, 'w', 1);
      else if (Math.random() < pr) { ally(P, id); log(`🤝 ${t.name} ACCEPTED your alliance!`, 'g', 1); }
      else { t.dn[P] = day + 12; log(`❌ ${t.name} DENIED your alliance.`, 'w', 1); }
    }
  } else if (k === 'peace') {
    const chance = (str(id) < str(P) * 1.2 ? .58 : .16) + (t.war.size > 1 ? .2 : 0);
    if (Math.random() < chance) peace(P, id); else log(`❌ ${t.name} rejects a ceasefire.`, 'w', 1);
  } else if (k === 'war') {
    const g = () => { warOn(P, id); ui(); };
    p.al.has(id) ? ask('Betray ally?', `Attack your ally <b>${t.name}</b>?`, [{ l: 'Betray', fn: g }, { l: 'Cancel' }]) : g();
  }
  ui();
}

      ctx.beginPath(); ctx.arc(q.x, q.y, q.R * Math.sqrt(p), 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    }
    // selection ring
    if (sel >= 0) {
      const r = Rg[sel]; ctx.strokeStyle = r.o === P ? '#7dffa6' : '#ffd54a'; ctx.lineWidth = 1.8 * lw; ctx.setLineDash([5 * lw, 4 * lw]);
      ctx.beginPath(); ctx.arc(r.cx, r.cy, Math.max(8, Math.min(34, Math.sqrt(r.n / Math.PI) * .5)), 0, 7); ctx.stroke(); ctx.setLineDash([]);
      if (P !== null && r.o === P && hov >= 0 && hov !== sel && r.nb.some(q => q[0] === hov)) {
        const e = Rg[hov], ex = r.cx + wdx(r.cx, e.cx);
        ctx.strokeStyle = e.o === P ? '#7dffa6' : '#ff6a5a'; ctx.lineWidth = 2.2 * lw; ctx.setLineDash([8 * lw, 5 * lw]);
        ctx.beginPath(); ctx.moveTo(r.cx, r.cy); ctx.lineTo(ex, e.cy); ctx.stroke(); ctx.setLineDash([]);
      }
    }
  }
  // screen-space text
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const ox of tiles) {
    if (settings.labels) for (const c of C) {
      if (!c.alive || !c.lbl) continue;
      const L = c.lbl, fs = clamp(L.sz * z * .17, 8, 24), txt = c.name.toUpperCase();
      if (c.id !== P && txt.length * fs * .64 > L.sz * 1.45 * z) continue;
      const x = L.x * z + ox, y = L.y * z + vy; if (x < -90 || x > cw + 90 || y < -20 || y > ch + 20) continue;
      ctx.font = `600 ${fs | 0}px system-ui`; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(8,16,28,.75)'; ctx.fillStyle = '#f6fbff';
      ctx.strokeText(txt, x, y); ctx.fillText(txt, x, y);
    }
    if (z > .9) for (const c of C) {
      if (!c.alive || !c.cpx || Rg[c.cap].o !== c.id) continue;
      const x = c.cpx[0] * z + ox, y = c.cpx[1] * z + vy; if (x < -40 || x > cw + 40 || y < -20 || y > ch + 20) continue;
      ctx.font = `${clamp(7 + z * 2.2, 9, 15) | 0}px system-ui`; ctx.fillStyle = '#ffd54a'; ctx.strokeStyle = '#0a1420'; ctx.lineWidth = 2.5;
      ctx.strokeText('★', x, y); ctx.fillText('★', x, y);
      if (z > 3) { ctx.font = 'italic 11px system-ui'; ctx.fillStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeText(c.city, x, y + 13); ctx.fillText(c.city, x, y + 13); }
    }
    for (const r of Rg) {
      const show = r.i === sel || r.inv.length || (z > 1.7 && r.n * z * z > 650);
      if (!show) continue;
      const x = r.cx * z + ox, y = r.cy * z + vy + 14; if (x < -40 || x > cw + 40 || y < -20 || y > ch + 20) continue;
      sign(x, y, '🪖', fmtN(r.troops), C[r.o].col);
      if (z > 3.2) { const bs = Object.keys(r.b).map(k => r.b[k] ? ICON[k] + r.b[k] : '').join(''); if (bs) { ctx.font = '10px system-ui'; ctx.fillStyle = '#fff'; ctx.fillText(bs, x, y + 15); } }
      if (r.inv.length) sign(x, y - 17, '⚔', fmtN(r.inv.reduce((s, v) => s + v.n, 0)), '#ff6a5a');
    }
    // signs over moving groups: small icon + compact count, on a short pole
    for (const m of M) {
      if (m._x === undefined || !(m.o === P || z > .8)) continue;
      const lift = m.type === 'plane' ? 24 : m.type === 'ship' ? 18 : 20, x = m._x * z + ox, uy = m._y * z + vy;
      if (x < -40 || x > cw + 40 || uy < -30 || uy > ch + 30) continue;
      sign(x, uy - lift, m.type === 'plane' ? '✈' : m.type === 'ship' ? '⚓' : '🪖', fmtN(m.n), C[m.o].col, uy - (m.type === 'plane' ? 8 : 5));
    }
  }
  // soft vignette
  const vg = ctx.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * .45, cw / 2, ch / 2, Math.max(cw, ch) * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(2,8,16,.38)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, cw, ch);
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * .6})`; ctx.fillRect(0, 0, cw, ch); flash -= dt * 1.3; }
  if (miniDirty || frameN % 12 === 0) drawMini();
}
function drawMini() {
  miniDirty = 0;
  const m = mini.getContext('2d'), k = mini.width / W;
  m.imageSmoothingEnabled = true; m.drawImage(oceanCv, 0, 0, mini.width, mini.height); m.drawImage(landCv, 0, 0, mini.width, mini.height);
  m.fillStyle = '#f44'; for (const r of Rg) if (r.inv.length) m.fillRect(r.cx * k - 1.5, r.cy * k - 1.5, 3, 3);
  m.strokeStyle = '#ffd54a'; m.lineWidth = 1.2;
  const x0 = -vx / z, w = cw / z, y0 = -vy / z, h = ch / z;
  for (const sx of [-W, 0, W]) m.strokeRect((x0 + sx) * k, y0 * k, w * k, h * k);
}

// =====================================================================
//  INPUT
// =====================================================================
function bindInput() {
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, vx, vy, m: 0, b: e.button }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    const rc = cv.getBoundingClientRect(); mxp = e.clientX - rc.left; myp = e.clientY - rc.top;
    if (drag && drag.b === 0) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 5) drag.m = 1;
      if (drag.m) { vx = drag.vx + dx; vy = drag.vy + dy; normV(); }
    } else {
      const h = hit(mxp, myp); if (h !== hov) { hov = h; hlDirty = 1; }
      const t = $('#tip');
      if (h >= 0) {
        const r = Rg[h], o = C[r.o];
        let s = `<b>${r.nm}</b><br>${o.name} · 🪖${r.troops | 0}${r.b.aa ? ` · 🎯${r.b.aa}` : ''}<br><small>${r.terr.n} · def ×${defm(r).toFixed(2)}</small>`;
        if (P === null) s += `<br><small>Power ${o.pw}/5 · ${own(r.o).length} provinces</small>`;
        if (P !== null && sel >= 0 && Rg[sel].o === P && r.o !== P && Rg[sel].nb.some(z => z[0] === h)) {
          const n = Rg[sel].troops * frac * (1 + .08 * tl(P, 'arm')), e2 = r.troops * defm(r), q = n / e2;
          s += `<br>Your ${n | 0} vs ${e2 | 0} def<br>Odds <b>${q.toFixed(2)}</b> — ${q > 1.6 ? '<span style="color:#8fe9b0">strong</span>' : q > 1.15 ? '<span style="color:#ffcc66">risky</span>' : '<span style="color:#ff8a80">likely fail</span>'}`;
        }
        t.style.display = 'block'; t.style.left = (mxp + 14) + 'px'; t.style.top = (myp + 14) + 'px'; t.innerHTML = s;
      } else t.style.display = 'none';
    }
  });
  cv.addEventListener('pointerup', () => { if (drag && !drag.m && drag.b === 0) click(mxp, myp); drag = null; });
  cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(mxp, myp, Math.exp(-e.deltaY * .0014)); }, { passive: false });
  cv.addEventListener('contextmenu', e => { e.preventDefault(); const h = hit(mxp, myp); if (h >= 0 && P !== null) { sel = h; hlDirty = 1; ui(); } });
  const miniGo = e => { const b = mini.getBoundingClientRect(); vx = cw / 2 - ((e.clientX - b.left) / b.width * W) * z; vy = ch / 2 - ((e.clientY - b.top) / b.height * H) * z; normV(); };
  mini.addEventListener('pointerdown', e => { mini.setPointerCapture(e.pointerId); mini._d = 1; miniGo(e); });
  mini.addEventListener('pointermove', e => { if (mini._d) miniGo(e); });
  mini.addEventListener('pointerup', () => { mini._d = 0; });
  addEventListener('resize', () => { resize(); normV(); });
  addEventListener('keydown', e => {
    if (modal || P === null) return;
    if (e.key === ' ') { e.preventDefault(); setSpeed(speed ? 0 : lastSpeed); }
    else if (e.key === '1') setSpeed(1); else if (e.key === '2') setSpeed(2); else if (e.key === '3') setSpeed(4);
    else if (e.key === 'Escape') { sel = -1; hlDirty = 1; ui(); }
    else if (e.key === 'f' || e.key === 'F') fit();
  });
}
function click(sx, sy) {
  const h = hit(sx, sy);
  if (h < 0) { sel = -1; hlDirty = 1; ui(); return; }
  if (P === null) {
    P = Rg[h].o; speed = 1; lastSpeed = 1; tab = 0; sel = h; calcStr();
    log(`You now command ${C[P].name}. Good luck!`, 'g', 1);
  } else if (!insp && sel >= 0 && Rg[sel].o === P && h !== sel && Rg[sel].nb.some(z => z[0] === h)) act(sel, h);
  else sel = h;
  hlDirty = 1; ui();
}

// =====================================================================
//  MAIN LOOP / BOOT
// =====================================================================
let last = 0, T0 = 0;
function loop(n) {
  const dt = Math.min(.1, (n - last) / 1000); last = n; T0 += dt; frameN++;
  const running = speed && !over && !modal && P !== null, dg = running ? dt * speed / 1.05 : 0;
  if (running) {
    gt += dg;
    for (let i = M.length - 1; i >= 0; i--) if (M[i].arr <= gt) { arrive(M[i]); M.splice(i, 1); }
    while (day < Math.floor(gt)) daily();
  }
  updateTurrets(dg, dt);
  for (let i = fx.length - 1; i >= 0; i--) { const f = fx[i]; f.t += dt; if (f.t >= f.d) { fx.splice(i, 1); f.cb && f.cb(); } }
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].t += dt; if (rings[i].t >= rings[i].d) rings.splice(i, 1); }
  for (let i = bul.length - 1; i >= 0; i--) { bul[i].t += dt; if (bul[i].t >= .1) bul.splice(i, 1); }
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.t += dt; q.x += q.vx * dt / z; q.y += q.vy * dt / z; q.vx *= .97; q.vy *= .97;
    if (q.t >= q.d) parts.splice(i, 1);
  }
  draw(dt, T0);
  requestAnimationFrame(loop);
}
function init() {
  try {
    buildWorld(); initCountries(); calcStr();
    dirtyAll = 1; resize(); fit(); bindInput(); ready = true; ui();
    $('#load').style.display = 'none';
    log('Pick your nation by clicking it.', 'n');
    ask('🌍 World at War 6',
      `Marching squads, banking aircraft, real warships and new <b>🎯 Anti-air</b> turrets that rip enemy airlifts out of the sky.<br>
      Terrain changes how battles are fought. Research technologies, build an economy, and out-manoeuvre rivals.<br>
      Difficulty only changes how often AI nations act. Then click a country.<br>
      <small>Scroll = zoom · drag = pan · right-click = inspect · ⚙️ = settings</small>`,
      [{ l: 'Easy', fn: () => diff = 0 }, { l: 'Normal', fn: () => diff = 1 }, { l: 'Hard', fn: () => diff = 2 }]);
    requestAnimationFrame(loop);
  } catch (e) { console.error(e); $('#load').textContent = 'Error building world: ' + e.message; }
}
setTimeout(init, 60);
</script>
